name: 🦊 OrangeFox Builder

on:
  workflow_dispatch:
    inputs:

      FOX_BRANCH:
        description: "OrangeFox Manifest Branch"
        required: true
        type: choice
        default: "12.1"
        options:
          - "12.1"
          - "14.1"

      DT_REPO_URL:
        description: "Custom Recovery Tree (public or private)"
        required: true
        type: string

      DT_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"
        type: string

      BUILD_TARGET:
        description: "Build Target"
        required: true
        type: choice
        default: "vendorbootimage"
        options:
          - "vendorbootimage"
          - "recoveryimage"
          - "bootimage"

      USE_LATEST_MAGISK:
        description: "Bundle latest Magisk zip?"
        required: true
        type: boolean
        default: true

      UPLOAD_RESULTS:
        description: "Upload result to oshi.at / Gofile?"
        required: true
        type: boolean
        default: true

      LDCHECK:
        description: "Run LDCHECK"
        required: false
        type: boolean
        default: false

      LDCHECKPATH:
        description: "Blob path for LDCHECK"
        required: false
        default: "system/bin/qseecomd"
        type: string

      RUNNER_TYPE:
        description: "Runner"
        required: true
        type: choice
        default: "github"
        options:
          - "github"
          - "self-hosted"

      SELF_HOSTED_LABEL:
        description: "Self-hosted runner label"
        required: false
        default: "self-hosted"
        type: string

      CCACHE_SIZE:
        description: "ccache max size"
        required: true
        type: choice
        default: "50G"
        options:
          - "20G"
          - "50G"
          - "80G"
          - "100G"
          - "150G"
          - "200G"

      REPO_SYNC_JOBS:
        description: "repo sync jobs (use 1-4 for stability)"
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
          - "4"

jobs:

  build:

    name: "🦊 fox_${{ inputs.FOX_BRANCH }}"

    runs-on: ${{ inputs.RUNNER_TYPE == 'self-hosted' && inputs.SELF_HOSTED_LABEL || 'ubuntu-22.04' }}

    timeout-minutes: 720

    permissions:
      contents: write

    env:
      GT_TOKEN: ${{ secrets.GT_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      OF_MAINTAINER: ${{ github.actor }}
      TARGET: ${{ inputs.BUILD_TARGET }}

      REPO_SYNC_JOBS: ${{ inputs.REPO_SYNC_JOBS }}

      JACK_SERVER_VM_ARGUMENTS: "-Dfile.encoding=UTF-8"

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout builder repository
        uses: actions/checkout@v4

      # ============================================================
      # INITIAL STATE
      # ============================================================

      - name: Initialize build state
        shell: bash
        run: |
          set -euo pipefail

          STATE_DIR="${RUNNER_TEMP}/mkvenompro-build-state"

          mkdir -p "$STATE_DIR"

          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"

          date +%s > "$STATE_DIR/build_start"

          : > "$STATE_DIR/completed_stages"
          : > "$STATE_DIR/failure_reason"
          : > "$STATE_DIR/build.log"

          echo "Initializing" > "$STATE_DIR/current_stage"
          date +%s > "$STATE_DIR/current_stage_start"

          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "FAILURE_CLASS=" >> "$GITHUB_ENV"
          echo "BUILD_FAILED_REASON=" >> "$GITHUB_ENV"

      # ============================================================
      # DISPLAY INPUTS
      # ============================================================

      - name: Display inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "       MKVenomPro OrangeFox CI"
          echo "========================================"

          echo "OrangeFox       : ${{ inputs.FOX_BRANCH }}"
          echo "Target          : ${{ inputs.BUILD_TARGET }}"
          echo "Device tree     : ${{ inputs.DT_REPO_URL }}"
          echo "Tree branch     : ${{ inputs.DT_BRANCH }}"
          echo "Magisk          : ${{ inputs.USE_LATEST_MAGISK }}"
          echo "ccache size     : ${{ inputs.CCACHE_SIZE }}"
          echo "Upload          : ${{ inputs.UPLOAD_RESULTS }}"
          echo "LDCheck         : ${{ inputs.LDCHECK }}"
          echo "Runner          : ${{ inputs.RUNNER_TYPE }}"
          echo "Sync jobs       : ${{ inputs.REPO_SYNC_JOBS }}"
          echo "Maintainer      : ${{ github.actor }}"

          echo "========================================"

      # ============================================================
      # PARSE INPUTS
      # ============================================================

      - name: Parse inputs
        shell: bash
        run: |
          set -euo pipefail

          SYNC_BRANCH="${{ inputs.FOX_BRANCH }}"
          FOX_BRANCH="fox_${SYNC_BRANCH}"
          BRANCH_INT="${SYNC_BRANCH%%.*}"

          SYNC_PATH="${GITHUB_WORKSPACE}/OrangeFox/${FOX_BRANCH}"

          {
            echo "FOX_BRANCH=$FOX_BRANCH"
            echo "SYNC_BRANCH=$SYNC_BRANCH"
            echo "BRANCH_INT=$BRANCH_INT"
            echo "SYNC_PATH=$SYNC_PATH"
          } >> "$GITHUB_ENV"

      # ============================================================
      # VALIDATE RUNNER
      # ============================================================

      - name: Validate runner
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner hostname:"
          hostname || true

          echo
          echo "CPU:"
          nproc || true

          echo
          echo "Memory:"
          free -h || true

          echo
          echo "Disk:"
          df -h / || true

          echo
          echo "Selected sync jobs:"
          echo "$REPO_SYNC_JOBS"

          if ! [[ "$REPO_SYNC_JOBS" =~ ^[1-4]$ ]]; then
            echo "::error::REPO_SYNC_JOBS must be between 1 and 4."
            exit 1
          fi

      # ============================================================
      # GITHUB RUNNER CLEANUP
      # ============================================================

      - name: Clean up GitHub runner
        if: inputs.RUNNER_TYPE != 'self-hosted'
        uses: rokibhasansagar/slimhub_actions@main

      - name: Add swap space
        if: inputs.RUNNER_TYPE != 'self-hosted'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      # ============================================================
      # STAGE HELPERS
      # ============================================================

      - name: Install stage helper
        shell: bash
        run: |
          set -euo pipefail

          cat > "$STATE_DIR/stage_start.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"

          NOW="$(date +%s)"

          echo "$STAGE" > "$STATE_DIR/current_stage"
          echo "$NOW" > "$STATE_DIR/current_stage_start"

          echo
          echo "========================================"
          echo "🔵 STAGE: $STAGE"
          echo "🕐 Started: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"
          EOF

          cat > "$STATE_DIR/stage_end.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"
          STATUS="${2:-success}"

          NOW="$(date +%s)"

          START="$(
            cat "$STATE_DIR/current_stage_start" \
            2>/dev/null ||
            echo "$NOW"
          )"

          ELAPSED=$((NOW - START))

          echo "$STAGE|$STATUS|$ELAPSED" \
            >> "$STATE_DIR/completed_stages"

          if [ "$STATUS" = "success" ]; then
            echo "🟢 STAGE COMPLETE: $STAGE"
            echo "⏱️ Duration: ${ELAPSED}s"
          else
            echo "🔴 STAGE FAILED: $STAGE"
            echo "⏱️ Duration: ${ELAPSED}s"
          fi
          EOF

          chmod +x \
            "$STATE_DIR/stage_start.sh" \
            "$STATE_DIR/stage_end.sh"

      # ============================================================
      # TELEGRAM HELPERS
      # ============================================================

      - name: Install Telegram helpers
        shell: bash
        run: |
          set -euo pipefail

          cat > "$STATE_DIR/tg_escape.sh" <<'EOF'
          #!/usr/bin/env bash

          printf '%s' "${1:-}" |
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g'
          EOF

          chmod +x "$STATE_DIR/tg_escape.sh"

      # ============================================================
      # TELEGRAM START
      # ============================================================

      - name: Telegram — build started
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram disabled."
            exit 0
          fi

          escape_html() {
            "$STATE_DIR/tg_escape.sh" "$1"
          }

          TEXT="$(
            printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n🚀 <b>BUILD STARTED</b>\n\n📢 <b>@mkvenompro</b>\n\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n🌲 Tree: <code>%s</code>\n🌿 Tree branch: <code>%s</code>\n🖥 Runner: <code>%s</code>\n⚙️ Sync jobs: <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n🔵 <b>Current stage:</b> Initializing\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
              "$(escape_html "$FOX_BRANCH")" \
              "$(escape_html "$TARGET")" \
              "$(escape_html "${{ inputs.DT_REPO_URL }}")" \
              "$(escape_html "${{ inputs.DT_BRANCH }}")" \
              "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
              "$(escape_html "$REPO_SYNC_JOBS")" \
              "$(escape_html "$OF_MAINTAINER")" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
          )"

          RESPONSE="$(
            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${TEXT}" \
              2>&1
          )"

          MESSAGE_ID="$(
            echo "$RESPONSE" |
              jq -r '.result.message_id // empty' \
              2>/dev/null
          )"

          if [ -n "$MESSAGE_ID" ]; then
            echo "$MESSAGE_ID" \
              > "$STATE_DIR/telegram_message_id"

            echo "Telegram start notification sent."
          else
            echo "::warning::Telegram start notification failed."
            echo "$RESPONSE"
          fi

      # ============================================================
      # TELEGRAM LIVE MONITOR
      # ============================================================

      - name: Start Telegram live monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ ! -f "$STATE_DIR/telegram_message_id" ]; then
            exit 0
          fi

          (
            while true; do

              sleep 20

              if [ -f "$STATE_DIR/stop_monitor" ]; then
                break
              fi

              START="$(
                cat "$STATE_DIR/build_start" \
                2>/dev/null ||
                date +%s
              )"

              NOW="$(date +%s)"

              TOTAL=$((NOW - START))

              STAGE="$(
                cat "$STATE_DIR/current_stage" \
                2>/dev/null ||
                echo "Initializing"
              )"

              STAGE_START="$(
                cat "$STATE_DIR/current_stage_start" \
                2>/dev/null ||
                echo "$NOW"
              )"

              STAGE_TIME=$((NOW - STAGE_START))

              format_time() {
                local S="${1:-0}"

                if [ "$S" -lt 60 ]; then
                  printf "%02ds" "$S"
                elif [ "$S" -lt 3600 ]; then
                  printf "%02dm %02ds" \
                    "$((S / 60))" \
                    "$((S % 60))"
                else
                  printf "%02dh %02dm %02ds" \
                    "$((S / 3600))" \
                    "$(((S % 3600) / 60))" \
                    "$((S % 60))"
                fi
              }

              escape_html() {
                "$STATE_DIR/tg_escape.sh" "$1"
              }

              TEXT="$(
                printf \
                  '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n🔵 <b>BUILDING</b>\n\n📢 <b>@mkvenompro</b>\n\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n📱 Device: <code>%s</code>\n🖥 Runner: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔵 <b>CURRENT STAGE</b>\n🏗️ <b>%s</b>\n⏱️ Stage: <code>%s</code>\n⏱️ Total: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
                  "$(escape_html "$FOX_BRANCH")" \
                  "$(escape_html "$TARGET")" \
                  "$(escape_html "${DEVICE_NAME:-detecting...}")" \
                  "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
                  "$(escape_html "$STAGE")" \
                  "$(format_time "$STAGE_TIME")" \
                  "$(format_time "$TOTAL")" \
                  "$GITHUB_REPOSITORY" \
                  "$GITHUB_RUN_ID"
              )"

              curl -sS \
                --connect-timeout 5 \
                --max-time 15 \
                -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/editMessageText" \
                -d "chat_id=${TG_CHAT_ID}" \
                -d "message_id=$(cat "$STATE_DIR/telegram_message_id")" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=${TEXT}" \
                >/dev/null 2>&1 || true

            done
          ) &

          echo $! > "$STATE_DIR/telegram_monitor_pid"

      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Prepare environment"

          {
            echo "Installing build dependencies..."
          } | tee -a "$STATE_DIR/build.log"

          sudo apt-get update -qq 2>&1 |
            tee -a "$STATE_DIR/build.log"

          sudo apt-get install -y \
            aria2 \
            jq \
            curl \
            wget \
            git \
            ccache \
            patchelf \
            cpio \
            lz4 \
            unzip \
            rsync \
            bc \
            bison \
            flex \
            gperf \
            build-essential \
            zip \
            unzip \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            libxml2-utils \
            xsltproc \
            2>&1 |
            tee -a "$STATE_DIR/build.log"

          if [ -d "$HOME/ofox-scripts/.git" ]; then

            cd "$HOME/ofox-scripts"

            git fetch --depth=1 origin 2>&1 |
              tee -a "$STATE_DIR/build.log"

            git reset --hard origin/HEAD 2>&1 |
              tee -a "$STATE_DIR/build.log"

          else

            rm -rf "$HOME/ofox-scripts"

            git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/misc/scripts \
              "$HOME/ofox-scripts" 2>&1 |
              tee -a "$STATE_DIR/build.log"

          fi

          cd "$HOME/ofox-scripts"

          sudo bash setup/android_build_env.sh 2>&1 |
            tee -a "$STATE_DIR/build.log"

          "$STATE_DIR/stage_end.sh" \
            "Prepare environment" \
            success

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Configure ccache"

          CANDIDATES=(
            "${RUNNER_TEMP}/mkvenompro-ccache"
            "${GITHUB_WORKSPACE}/.ccache"
            "${HOME}/.cache/ccache"
            "${HOME}/.ccache"
          )

          CCACHE_SELECTED=""

          for DIR in "${CANDIDATES[@]}"; do

            mkdir -p "$DIR" 2>/dev/null || continue

            TEST="$DIR/.write-test"

            if touch "$TEST" 2>/dev/null; then
              rm -f "$TEST"
              CCACHE_SELECTED="$DIR"
              break
            fi

          done

          if [ -z "$CCACHE_SELECTED" ]; then
            echo "::error::No writable ccache directory found."

            {
              echo "CCACHE"
              echo "No writable ccache directory was available."
            } > "$STATE_DIR/failure_reason"

            exit 1
          fi

          {
            echo "CCACHE_DIR=$CCACHE_SELECTED"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
          } >> "$GITHUB_ENV"

          mkdir -p "$CCACHE_SELECTED"

          ccache -M "${{ inputs.CCACHE_SIZE }}"
          ccache -z
          ccache -s

          echo "CCACHE_DIR=$CCACHE_SELECTED"

          "$STATE_DIR/stage_end.sh" \
            "Configure ccache" \
            success

      # ============================================================
      # RESTORE CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.FOX_BRANCH }}-${{ hashFiles('**/BoardConfig.mk') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.FOX_BRANCH }}-
            ccache-${{ runner.os }}-

      # ============================================================
      # GIT AUTH
      # ============================================================

      - name: Configure git authentication
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Configure git"

          git config --global user.name \
            "${{ github.actor }}"

          git config --global user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git config --global color.ui false

          if [ -n "${GT_TOKEN:-}" ]; then

            git config --global \
              url."https://x-access-token:${GT_TOKEN}@github.com/".insteadOf \
              "https://github.com/"

          fi

          "$STATE_DIR/stage_end.sh" \
            "Configure git" \
            success

      # ============================================================
      # CLONE ORANGEFOX SYNC
      # ============================================================

      - name: Clone OrangeFox sync
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Clone OrangeFox sync"

          mkdir -p \
            "${GITHUB_WORKSPACE}/OrangeFox"

          cd \
            "${GITHUB_WORKSPACE}/OrangeFox"

          if [ -d "sync/.git" ]; then

            cd sync

            git fetch --depth=1 origin 2>&1 |
              tee -a "$STATE_DIR/build.log"

            git reset --hard origin/HEAD 2>&1 |
              tee -a "$STATE_DIR/build.log"

          else

            rm -rf sync

            git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/sync.git \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

          fi

          "$STATE_DIR/stage_end.sh" \
            "Clone OrangeFox sync" \
            success

      # ============================================================
      # SELF-HOSTED REPAIR
      # ============================================================

      - name: Repair self-hosted tree
        if: inputs.RUNNER_TYPE == 'self-hosted'
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Repair self-hosted tree"

          if [ -d "$SYNC_PATH/.repo" ]; then

            cd "$SYNC_PATH"

            echo "Checking existing repo projects..."

            repo forall -c '
              if ! git status >/dev/null 2>&1; then
                echo "Corrupted checkout: $REPO_PATH"
                rm -rf "$REPO_PATH"
              fi
            ' 2>&1 |
              tee -a "$STATE_DIR/build.log" || true

          else

            echo "No existing OrangeFox source tree."

          fi

          "$STATE_DIR/stage_end.sh" \
            "Repair self-hosted tree" \
            success

      # ============================================================
      # RESET SELF-HOSTED MODIFICATIONS
      # ============================================================

      - name: Reset self-hosted patched files
        if: inputs.RUNNER_TYPE == 'self-hosted'
        shell: bash
        run: |
          set -uo pipefail

          if [ -d "$SYNC_PATH/.repo" ]; then

            cd "$SYNC_PATH"

            repo forall -c '
              git checkout -f -- . >/dev/null 2>&1 || true
              git clean -fd >/dev/null 2>&1 || true
            ' 2>&1 |
              tee -a "$STATE_DIR/build.log" || true

          fi

      # ============================================================
      # PATCH ORANGEFOX SYNC JOB COUNT
      # ============================================================

      - name: Patch OrangeFox sync concurrency
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Patch OrangeFox sync concurrency"

          SCRIPT="${GITHUB_WORKSPACE}/OrangeFox/sync/orangefox_sync.sh"

          if [ ! -f "$SCRIPT" ]; then

            echo "::error::orangefox_sync.sh not found."

            {
              echo "SOURCE SYNC"
              echo "orangefox_sync.sh was not found."
            } > "$STATE_DIR/failure_reason"

            exit 1
          fi

          cp -f \
            "$SCRIPT" \
            "${SCRIPT}.mkvenompro-original"

          python3 - "$SCRIPT" "$REPO_SYNC_JOBS" <<'PY'
          import sys
          from pathlib import Path

          script = Path(sys.argv[1])
          jobs = sys.argv[2]

          text = script.read_text()

          old = 'repo sync --force-sync -c -j$(nproc --all) --no-clone-bundle --no-tags "$@"'

          new = 'repo sync --force-sync -c -j${REPO_SYNC_JOBS:-' + jobs + '} --no-clone-bundle --no-tags "$@"'

          if old not in text:
              raise SystemExit(
                  "Expected OrangeFox repo_sync command was not found. "
                  "Refusing unsafe modification."
              )

          text = text.replace(old, new, 1)

          script.write_text(text)
          PY

          echo
          echo "Patched repo sync:"
          grep -n \
            "repo sync --force-sync" \
            "$SCRIPT" || true

          "$STATE_DIR/stage_end.sh" \
            "Patch OrangeFox sync concurrency" \
            success

      # ============================================================
      # SOURCE SYNC WITH FALLBACK
      # ============================================================

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Sync OrangeFox sources"

          cd "${GITHUB_WORKSPACE}/OrangeFox/sync"

          chmod +x ./orangefox_sync.sh

          ATTEMPT=1
          MAX_ATTEMPTS=2

          SYNC_OK=0

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            echo
            echo "========================================"
            echo "OrangeFox sync attempt $ATTEMPT/$MAX_ATTEMPTS"
            echo "repo jobs: $REPO_SYNC_JOBS"
            echo "========================================"

            ./orangefox_sync.sh \
              --branch "$SYNC_BRANCH" \
              --path "$SYNC_PATH" \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

            RC=${PIPESTATUS[0]}

            if [ "$RC" -eq 0 ]; then

              SYNC_OK=1
              break

            fi

            echo
            echo "OrangeFox sync failed with code $RC."

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then

              echo
              echo "Attempting safe fallback with repo -j1..."

              if [ -d "$SYNC_PATH/.repo" ]; then

                cd "$SYNC_PATH"

                repo sync \
                  --force-sync \
                  -c \
                  -j1 \
                  --fail-fast \
                  --no-clone-bundle \
                  --no-tags \
                  2>&1 |
                  tee -a "$STATE_DIR/build.log"

                FALLBACK_RC=${PIPESTATUS[0]}

                if [ "$FALLBACK_RC" -eq 0 ]; then

                  echo "Fallback sync succeeded."

                  cd "${GITHUB_WORKSPACE}/OrangeFox/sync"

                else

                  echo "Fallback sync failed."

                fi

              fi

            fi

            ATTEMPT=$((ATTEMPT + 1))

          done

          if [ "$SYNC_OK" -ne 1 ]; then

            echo "::error::OrangeFox source sync failed."

            {
              echo "SOURCE SYNC"
              echo "OrangeFox source synchronization failed."
              echo
              echo "Detected sync configuration:"
              echo "repo jobs: $REPO_SYNC_JOBS"
              echo
              echo "Last sync errors:"
              grep -E \
                "RESOURCE_EXHAUSTED|fatal:|error:|SyncError|Failed|failed" \
                "$STATE_DIR/build.log" |
                tail -40 || true
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Sync OrangeFox sources" \
              >> "$GITHUB_ENV"

            exit 1

          fi

          "$STATE_DIR/stage_end.sh" \
            "Sync OrangeFox sources" \
            success

      # ============================================================
      # GUAVA
      # ============================================================

      - name: Ensure Guava dependency
        if: inputs.FOX_BRANCH == '14.1'
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Ensure dependencies"

          cd "$SYNC_PATH"

          if [ -f external/guava/Android.bp ] && \
             grep -q \
             'name:[[:space:]]*"guava"' \
             external/guava/Android.bp; then

            echo "Guava already available."

          else

            echo "Guava missing. Cloning fallback..."

            rm -rf external/guava

            git clone \
              --depth=1 \
              https://android.googlesource.com/platform/external/guava \
              external/guava \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

          fi

          "$STATE_DIR/stage_end.sh" \
            "Ensure dependencies" \
            success

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Clone device tree
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Clone device tree"

          cd "$SYNC_PATH"

          DT_URL="${{ inputs.DT_REPO_URL }}"
          DT_BRANCH="${{ inputs.DT_BRANCH }}"

          rm -rf device_tree_staging

          echo "Device tree:"
          echo "$DT_URL"
          echo "Branch:"
          echo "$DT_BRANCH"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DT_BRANCH" \
            "$DT_URL" \
            device_tree_staging \
            2>&1 |
            tee -a "$STATE_DIR/build.log"

          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then

            {
              echo "DEVICE TREE"
              echo "Failed to clone the supplied device tree."
              echo
              echo "Repository: $DT_URL"
              echo "Branch: $DT_BRANCH"
              echo
              tail -50 "$STATE_DIR/build.log"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Clone device tree" \
              >> "$GITHUB_ENV"

            exit "$RC"

          fi

          STAGING_PATH="$SYNC_PATH/device_tree_staging"

          cd "$STAGING_PATH"

          DEVICE_MAKEFILE=""
          DEVICE_DIRECTORY=""
          DEVICE_NAME=""

          while IFS= read -r -d '' file; do

            PRODUCT_NAME="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:?=[[:space:]]*//p' \
                "$file" |
                head -1
            )"

            PRODUCT_BRAND="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:?=[[:space:]]*//p' \
                "$file" |
                head -1
            )"

            PRODUCT_DEVICE="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:?=[[:space:]]*//p' \
                "$file" |
                head -1
            )"

            if [ -n "$PRODUCT_NAME" ] && \
               [ -n "$PRODUCT_BRAND" ] && \
               [ -n "$PRODUCT_DEVICE" ]; then

              DEVICE_MAKEFILE="$(basename "$file")"
              DEVICE_DIRECTORY="device/$PRODUCT_BRAND"
              DEVICE_NAME="$PRODUCT_DEVICE"

              break

            fi

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.mk" \
              -print0
          )

          REPO_BASENAME="$(
            basename "$DT_URL" .git
          )"

          if [ -z "$DEVICE_NAME" ]; then

            FALLBACK_BRAND="$(
              echo "$REPO_BASENAME" |
                awk -F'_' '{print $(NF-1)}'
            )"

            FALLBACK_DEVICE="$(
              echo "$REPO_BASENAME" |
                awk -F'_' '{print $NF}'
            )"

            case "$FALLBACK_BRAND" in
              device|recovery|tree|android|"")
                FALLBACK_BRAND="unknown"
                ;;
            esac

            case "$FALLBACK_DEVICE" in
              device|recovery|tree|android|"")
                FALLBACK_DEVICE="unknown"
                ;;
            esac

            DEVICE_DIRECTORY="device/$FALLBACK_BRAND"
            DEVICE_NAME="$FALLBACK_DEVICE"

          fi

          if [ "$DEVICE_NAME" = "unknown" ]; then

            {
              echo "DEVICE TREE"
              echo "Could not detect device codename."
              echo
              echo "PRODUCT_DEVICE / PRODUCT_BRAND were not found."
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Clone device tree" \
              >> "$GITHUB_ENV"

            exit 1

          fi

          mkdir -p \
            "$SYNC_PATH/$DEVICE_DIRECTORY"

          rm -rf \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          mv \
            "$STAGING_PATH" \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          TREE_PATH="$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          COMMIT_ID="$(
            git -C "$TREE_PATH" rev-parse HEAD
          )"

          if [ ! -f "$TREE_PATH/vendorsetup.sh" ]; then
            touch "$TREE_PATH/vendorsetup.sh"
          fi

          if [ -f "$TREE_PATH/BoardConfig.mk" ]; then

            sed -i \
              '/^[[:space:]]*BOARD_RAMDISK_USE_LZ4[[:space:]]*=/d' \
              "$TREE_PATH/BoardConfig.mk" \
              || true

          fi

          {
            echo "DEVICE_NAME=$DEVICE_NAME"
            echo "DEVICE_DIRECTORY=$DEVICE_DIRECTORY"
            echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE"
            echo "DEVICE_TREE_PATH=$TREE_PATH"
            echo "COMMIT_ID=$COMMIT_ID"
          } >> "$GITHUB_ENV"

          echo "$DEVICE_NAME" \
            > "$STATE_DIR/device"

          echo
          echo "========================================"
          echo "Detected device"
          echo "Device : $DEVICE_NAME"
          echo "Path   : $TREE_PATH"
          echo "Tree   : $DEVICE_MAKEFILE"
          echo "Commit : $COMMIT_ID"
          echo "========================================"

          "$STATE_DIR/stage_end.sh" \
            "Clone device tree" \
            success

      # ============================================================
      # MAGISK
      # ============================================================

      - name: Download latest Magisk
        if: inputs.USE_LATEST_MAGISK == true
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Download Magisk"

          mkdir -p "$HOME/Magisk"

          cd "$HOME/Magisk"

          API_HEADERS=(
            -H "Accept: application/vnd.github+json"
          )

          if [ -n "${GT_TOKEN:-}" ]; then
            API_HEADERS+=(
              -H "Authorization: Bearer ${GT_TOKEN}"
            )
          fi

          RESPONSE="$(
            curl -fsSL \
              "${API_HEADERS[@]}" \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          )"

          URL="$(
            echo "$RESPONSE" |
              jq -r \
                '[.assets[] |
                select(.name | test("^Magisk-.*\\.apk$")) |
                .browser_download_url][0]'
          )"

          if [ -z "$URL" ] || \
             [ "$URL" = "null" ]; then

            {
              echo "MAGISK"
              echo "Latest Magisk APK was not found."
            } > "$STATE_DIR/failure_reason"

            exit 1

          fi

          aria2c \
            -x4 \
            -s4 \
            -o magisk.apk \
            "$URL" \
            || \
          curl -fL \
            "$URL" \
            -o magisk.apk

          test -s magisk.apk

          mv \
            magisk.apk \
            Magisk-latest.zip

          echo \
            "FOX_USE_SPECIFIC_MAGISK_ZIP=$HOME/Magisk/Magisk-latest.zip" \
            >> "$GITHUB_ENV"

          "$STATE_DIR/stage_end.sh" \
            "Download Magisk" \
            success

      # ============================================================
      # LDCHECK
      # ============================================================

      - name: Configure LDCHECK
        if: inputs.LDCHECK == true
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Configure LDCHECK"

          {
            echo "LDCHECK_ENABLED=true"
            echo "LDCHECK_PATH=${{ inputs.LDCHECKPATH }}"
          } >> "$GITHUB_ENV"

          echo "LDCHECK path:"
          echo "${{ inputs.LDCHECKPATH }}"

          "$STATE_DIR/stage_end.sh" \
            "Configure LDCHECK" \
            success

      # ============================================================
      # VINTF PATCH REPAIR
      # ============================================================

      - name: Repair incompatible VINTF patch
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Repair VINTF patch compatibility"

          cd "$SYNC_PATH"

          FOUND=0

          while IFS= read -r -d '' PATCH; do

            if grep -q \
              "system/libvintf/parse_xml.cpp" \
              "$PATCH" \
              2>/dev/null && \
               grep -qi \
              "manifest.version" \
              "$PATCH" \
              2>/dev/null; then

              BACKUP="${PATCH}.mkvenompro-disabled"

              if [ ! -e "$BACKUP" ]; then

                mv \
                  "$PATCH" \
                  "$BACKUP"

                echo "Disabled:"
                echo "$PATCH"

              fi

              FOUND=1

            fi

          done < <(
            find "$SYNC_PATH" \
              -type f \
              \( \
                -name "*.patch" \
                -o \
                -name "*.diff" \
              \) \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No incompatible VINTF patch detected."
          else
            echo "VINTF compatibility patch handled."
          fi

          "$STATE_DIR/stage_end.sh" \
            "Repair VINTF patch compatibility" \
            success

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Build OrangeFox"

          cd "$SYNC_PATH"

          BUILD_LOG="$STATE_DIR/build.log"

          export ZSH_VERSION=""

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export OF_MAINTAINER="$OF_MAINTAINER"

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_TYPE="Unofficial-CI"

          export LC_ALL=C

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          export FOX_MAINTAINER_PATCH_VERSION=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          if [ -n "${FOX_USE_SPECIFIC_MAGISK_ZIP:-}" ]; then
            export FOX_USE_SPECIFIC_MAGISK_ZIP
          fi

          echo "========================================" |
            tee -a "$BUILD_LOG"

          echo "OrangeFox build started" |
            tee -a "$BUILD_LOG"

          echo "Device: $DEVICE_NAME" |
            tee -a "$BUILD_LOG"

          echo "Target: $TARGET" |
            tee -a "$BUILD_LOG"

          echo "========================================" |
            tee -a "$BUILD_LOG"

          set -e

          if ! source build/envsetup.sh 2>&1 |
            tee -a "$BUILD_LOG"; then

            set +e

            {
              echo "BUILD / ENVSETUP"
              echo "build/envsetup.sh failed."
              echo
              tail -120 "$BUILD_LOG"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"

            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure

            exit 1

          fi

          LUNCH_OVERRIDE="$DEVICE_TREE_PATH/lunch_target.txt"

          if [ -f "$LUNCH_OVERRIDE" ]; then

            LUNCH_TARGET="$(
              tr -d '[:space:]' \
              < "$LUNCH_OVERRIDE"
            )

          else

            LUNCH_TARGET="twrp_${DEVICE_NAME}-eng"

          fi

          echo "Lunch target: $LUNCH_TARGET" |
            tee -a "$BUILD_LOG"

          if ! lunch "$LUNCH_TARGET" 2>&1 |
            tee -a "$BUILD_LOG"; then

            set +e

            {
              echo "BUILD / LUNCH"
              echo "lunch failed."
              echo
              tail -120 "$BUILD_LOG"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"

            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure

            exit 1

          fi

          if ! make clean 2>&1 |
            tee -a "$BUILD_LOG"; then

            set +e

            {
              echo "BUILD / CLEAN"
              echo "make clean failed."
              echo
              tail -120 "$BUILD_LOG"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"

            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure

            exit 1

          fi

          if ! mka adbd "$TARGET" 2>&1 |
            tee -a "$BUILD_LOG"; then

            set +e

            {
              echo "BUILD / COMPILATION"
              echo "OrangeFox compilation failed."
              echo
              tail -150 "$BUILD_LOG"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"

            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure

            exit 1

          fi

          "$STATE_DIR/stage_end.sh" \
            "Build OrangeFox" \
            success

      # ============================================================
      # OPTIONAL LIBRARY PATCH
      # ============================================================

      - name: Optional shared-library patch
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Optional library patch"

          FIX_CONF="$DEVICE_TREE_PATH/lib_fix.conf"

          if [ ! -f "$FIX_CONF" ]; then

            echo "lib_fix.conf not present."

            "$STATE_DIR/stage_end.sh" \
              "Optional library patch" \
              success

            exit 0

          fi

          source "$FIX_CONF"

          LIB="${LIB_NAME:?LIB_NAME missing}"
          SYMBOL="${SYMBOL:?SYMBOL missing}"

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          RECOVERY_BIN="$OUT/recovery/root/system/bin/recovery"

          if [ ! -f "$RECOVERY_BIN" ]; then

            {
              echo "OPTIONAL LIBRARY PATCH"
              echo "Recovery binary was not found."
              echo
              echo "$RECOVERY_BIN"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Optional library patch" \
              >> "$GITHUB_ENV"

            exit 1

          fi

          mkdir -p \
            "$OUT/recovery/root/vendor/lib64"

          SRC=""

          while IFS= read -r candidate; do

            if [ -f "$candidate" ]; then

              SRC="$candidate"
              break

            fi

          done < <(
            find \
              "$OUT/obj" \
              "$OUT/system" \
              "$OUT/vendor" \
              -type f \
              -name "$LIB" \
              2>/dev/null |
              head -20
          )

          if [ -n "$SRC" ] && \
             nm -D "$SRC" 2>/dev/null |
             grep -q "$SYMBOL"; then

            cp -f \
              "$SRC" \
              "$OUT/recovery/root/vendor/lib64/$LIB"

          else

            DT_LIB="$DEVICE_TREE_PATH/recovery/root/vendor/lib64/$LIB"

            if [ ! -f "$DT_LIB" ]; then

              {
                echo "OPTIONAL LIBRARY PATCH"
                echo "No valid $LIB was found."
                echo "Required symbol: $SYMBOL"
              } > "$STATE_DIR/failure_reason"

              echo "FAILED_STAGE=Optional library patch" \
                >> "$GITHUB_ENV"

              exit 1

            fi

            if ! nm -D "$DT_LIB" 2>/dev/null |
              grep -q "$SYMBOL"; then

              {
                echo "OPTIONAL LIBRARY PATCH"
                echo "$DT_LIB does not export $SYMBOL"
              } > "$STATE_DIR/failure_reason"

              echo "FAILED_STAGE=Optional library patch" \
                >> "$GITHUB_ENV"

              exit 1

            fi

            cp -f \
              "$DT_LIB" \
              "$OUT/recovery/root/vendor/lib64/$LIB"

          fi

          if ! patchelf \
            --print-needed \
            "$RECOVERY_BIN" \
            2>/dev/null |
            grep -Fxq "$LIB"; then

            patchelf \
              --add-needed \
              "$LIB" \
              "$RECOVERY_BIN"

          fi

          rm -f \
            "$OUT/vendor_boot.img" \
            "$OUT/recovery.img" \
            "$OUT/boot.img" \
            "$OUT/ramdisk-recovery.cpio" \
            "$OUT/ramdisk-recovery.img" \
            "$OUT/ramdisk-recovery.cpio.gz" \
            "$OUT/ramdisk-recovery.cpio.lz4" \
            "$OUT/ramdisk-recovery.cpio.lzma" \
            || true

          rm -rf \
            "$OUT/obj/PACKAGING/ramdisk_recovery_intermediates" \
            || true

          touch "$OUT/recovery/root/init"

          cd "$SYNC_PATH"

          if ! mka "$TARGET" 2>&1 |
            tee -a "$STATE_DIR/build.log"; then

            {
              echo "OPTIONAL LIBRARY PATCH"
              echo "Rebuild after library patch failed."
              echo
              tail -120 "$STATE_DIR/build.log"
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Optional library patch" \
              >> "$GITHUB_ENV"

            exit 1

          fi

          "$STATE_DIR/stage_end.sh" \
            "Optional library patch" \
            success

      # ============================================================
      # VALIDATE OUTPUT
      # ============================================================

      - name: Validate build output
        shell: bash
        run: |
          set -uo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Validate output"

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          case "$TARGET" in

            vendorbootimage)
              IMAGE="$OUT/vendor_boot.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-vendor_boot.img"
              ;;

            recoveryimage)
              IMAGE="$OUT/recovery.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-recovery.img"
              ;;

            bootimage)
              IMAGE="$OUT/boot.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-boot.img"
              ;;

            *)
              echo "::error::Unsupported target."

              {
                echo "OUTPUT"
                echo "Unsupported build target: $TARGET"
              } > "$STATE_DIR/failure_reason"

              exit 1
              ;;

          esac

          if [ ! -f "$IMAGE" ]; then

            {
              echo "OUTPUT VALIDATION"
              echo "Expected image was not produced."
              echo
              echo "Expected:"
              echo "$IMAGE"
              echo
              echo "Available output:"
              find "$OUT" \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' |
                sort || true
            } > "$STATE_DIR/failure_reason"

            echo "FAILED_STAGE=Validate output" \
              >> "$GITHUB_ENV"

            exit 1

          fi

          SIZE="$(
            stat -c%s "$IMAGE"
          )"

          MD5="$(
            md5sum "$IMAGE" |
              awk '{print $1}'
          )"

          cp -f \
            "$IMAGE" \
            "$OUT/$RELEASE_IMAGE"

          {
            echo "OUT_DIR=$OUT"
            echo "IMAGE_PATH=$IMAGE"
            echo "RELEASE_IMAGE=$RELEASE_IMAGE"
            echo "IMAGE_SIZE=$SIZE"
            echo "MD5_IMG=$MD5"
            echo "CHECK_IMG_IS_OK=true"
          } >> "$GITHUB_ENV"

          echo "Image : $IMAGE"
          echo "Size  : $SIZE bytes"
          echo "MD5   : $MD5"

          "$STATE_DIR/stage_end.sh" \
            "Validate output" \
            success

      # ============================================================
      # FIND ZIP
      # ============================================================

      - name: Find OrangeFox ZIP
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Find ZIP"

          ZIP="$(
            find "$OUT_DIR" \
              -maxdepth 1 \
              -type f \
              -iname 'OrangeFox*.zip' \
              -print \
              -quit \
              2>/dev/null ||
              true
          )"

          if [ -n "$ZIP" ]; then

            MD5_ZIP="$(
              md5sum "$ZIP" |
                awk '{print $1}'
            )"

            {
              echo "FOX_ZIP=$ZIP"
              echo "MD5_ZIP=$MD5_ZIP"
              echo "CHECK_ZIP_IS_OK=true"
            } >> "$GITHUB_ENV"

            echo "ZIP found: $ZIP"

          else

            echo "No OrangeFox ZIP generated."

          fi

          "$STATE_DIR/stage_end.sh" \
            "Find ZIP" \
            success

      # ============================================================
      # BUILD METADATA
      # ============================================================

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail

          echo \
            "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" \
            >> "$GITHUB_ENV"

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Upload to GitHub Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IMAGE_PATH }}
            ${{ env.OUT_DIR }}/${{ env.RELEASE_IMAGE }}
            ${{ env.FOX_ZIP }}
            ${{ env.OUT_DIR }}/ramdisk-recovery.*
          name: "🦊 OrangeFox ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"
          tag_name: "build-${{ github.run_id }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🦊 OrangeFox Recovery — `${{ env.DEVICE_NAME }}`

            | | |
            |---|---|
            | **OrangeFox** | `${{ env.FOX_BRANCH }}` |
            | **Target** | `${{ env.TARGET }}` |
            | **Device tree** | `${{ inputs.DT_REPO_URL }}` |
            | **Tree branch** | `${{ inputs.DT_BRANCH }}` |
            | **Tree commit** | `${{ env.COMMIT_ID }}` |
            | **Maintainer** | `${{ env.OF_MAINTAINER }}` |
            | **Build date** | `${{ env.BUILD_DATE }}` |
            | **Image size** | `${{ env.IMAGE_SIZE }}` bytes |
            | **MD5 (image)** | `${{ env.MD5_IMG }}` |
            | **MD5 (ZIP)** | `${{ env.MD5_ZIP }}` |
            | **Runner** | `${{ inputs.RUNNER_TYPE }}` |
            | **Sync jobs** | `${{ inputs.REPO_SYNC_JOBS }}` |

      # ============================================================
      # OSHI
      # ============================================================

      - name: Mirror image to oshi.at
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          FILE="$IMAGE_PATH"

          RESULT="$(
            curl -skT "$FILE" \
              "https://oshi.at/OrangeFox-${DEVICE_NAME}-${TARGET}.img/20160" \
              2>/dev/null ||
              true
          )"

          LINK="$(
            echo "$RESULT" |
              awk '/DL:/ {print $2; exit}'
          )"

          if [ -n "$LINK" ]; then
            echo "OSHI_LINK=$LINK" \
              >> "$GITHUB_ENV"

            echo "oshi.at: $LINK"
          fi

      # ============================================================
      # GOFILE
      # ============================================================

      - name: Mirror image to Gofile
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          FILE="$IMAGE_PATH"

          SERVER="$(
            curl -fsSL \
              https://api.gofile.io/servers |
              jq -r \
                '.data.servers[0].name // empty' \
              2>/dev/null ||
              true
          )"

          if [ -z "$SERVER" ]; then
            exit 0
          fi

          RESPONSE="$(
            curl -fsSL \
              -F "file=@${FILE}" \
              "https://${SERVER}.gofile.io/uploadFile" \
              2>/dev/null ||
              true
          )"

          LINK="$(
            echo "$RESPONSE" |
              jq -r \
                '.data.downloadPage // empty' \
              2>/dev/null ||
              true
          )"

          if [ -n "$LINK" ]; then

            echo "GOFILE_LINK=$LINK" \
              >> "$GITHUB_ENV"

            echo "Gofile: $LINK"

          fi

      # ============================================================
      # SMART FAILURE ANALYZER
      # ============================================================

      - name: Smart failure analyzer
        if: always()
        shell: bash
        run: |
          set +e

          LOG="$STATE_DIR/build.log"

          if [ ! -f "$LOG" ]; then
            touch "$LOG"
          fi

          if [ -f "$STATE_DIR/failure_reason" ] && \
             [ -s "$STATE_DIR/failure_reason" ]; then

            RAW_REASON="$(
              cat "$STATE_DIR/failure_reason"
            )"

          else

            RAW_REASON=""

          fi

          CLASS="UNKNOWN"
          SUMMARY="Build failed."

          if grep -Eiq \
            'RESOURCE_EXHAUSTED|quota|429|rate.?limit|network changes failed|Failed to download|unable to fully sync|SyncError' \
            "$LOG"; then

            CLASS="SOURCE_SYNC"
            SUMMARY="OrangeFox/AOSP source sync failed because of network, Git server quota, or excessive repo concurrency."

          elif grep -Eiq \
            'Permission denied|Authentication failed|could not read Username|repository not found|403 Forbidden|401 Unauthorized' \
            "$LOG"; then

            CLASS="GIT_AUTH"
            SUMMARY="Git authentication or repository access failed."

          elif grep -Eiq \
            'No space left on device|disk quota exceeded|ENOSPC' \
            "$LOG"; then

            CLASS="DISK"
            SUMMARY="The runner ran out of disk space."

          elif grep -Eiq \
            'Out of memory|Cannot allocate memory|Killed process|oom-kill|OOM' \
            "$LOG"; then

            CLASS="MEMORY"
            SUMMARY="The build was killed because of insufficient RAM or memory pressure."

          elif grep -Eiq \
            'ccache.*error|ccache: error|permission.*ccache' \
            "$LOG"; then

            CLASS="CCACHE"
            SUMMARY="ccache configuration or storage failed."

          elif grep -Eiq \
            'envsetup|build/envsetup.sh' \
            "$LOG"; then

            CLASS="ENVSETUP"
            SUMMARY="Android/OrangeFox build environment initialization failed."

          elif grep -Eiq \
            'lunch.*failed|Invalid lunch|No such lunch combo|does not exist' \
            "$LOG"; then

            CLASS="LUNCH"
            SUMMARY="The selected Android lunch target is invalid or missing from the device tree."

          elif grep -Eiq \
            'parse_xml.cpp|libvintf|manifest.version|VINTF' \
            "$LOG"; then

            CLASS="VINTF"
            SUMMARY="A VINTF/libvintf compatibility error was detected."

          elif grep -Eiq \
            'fatal error:.*No such file|No such file or directory|missing.*dependency|module.*not found|cannot find -l' \
            "$LOG"; then

            CLASS="DEPENDENCY"
            SUMMARY="A required source file, module, library, or build dependency is missing."

          elif grep -Eiq \
            'FAILED:|error:|fatal error:|undefined reference|ninja: build stopped|make.*Error' \
            "$LOG"; then

            CLASS="COMPILATION"
            SUMMARY="The Android/OrangeFox compilation failed."

          elif grep -Eiq \
            'vendor_boot.img.*not found|recovery.img.*not found|boot.img.*not found|Expected image was not produced' \
            "$LOG"; then

            CLASS="OUTPUT"
            SUMMARY="The build finished without producing the expected recovery image."

          elif grep -Eiq \
            'Could not detect device|PRODUCT_DEVICE|device codename' \
            "$LOG"; then

            CLASS="DEVICE_TREE"
            SUMMARY="The device tree could not be identified correctly."

          fi

          if [ -n "$RAW_REASON" ]; then
            DETAILS="$RAW_REASON"
          else
            DETAILS="$SUMMARY"
          fi

          if [ -f "$LOG" ]; then

            LAST_ERRORS="$(
              grep -E \
                'RESOURCE_EXHAUSTED|fatal:|FAILED:|error:|Error:|ERROR:|failed|Failure|ninja:|make.*Error' \
                "$LOG" |
                tail -25
            )"

          else

            LAST_ERRORS="No build log was available."

          fi

          if [ -z "$LAST_ERRORS" ]; then
            LAST_ERRORS="No matching error lines were detected."
          fi

          {
            echo "FAILURE_CLASS=$CLASS"
            echo "BUILD_FAILED_REASON=$SUMMARY"
          } >> "$GITHUB_ENV"

          {
            echo "FAILURE_CLASS=$CLASS"
            echo "$SUMMARY"
            echo
            echo "$DETAILS"
            echo
            echo "Last detected errors:"
            echo "$LAST_ERRORS"
          } > "$STATE_DIR/failure_reason"

          echo
          echo "========================================"
          echo "🧠 SMART FAILURE ANALYSIS"
          echo "========================================"
          echo "Class  : $CLASS"
          echo "Summary: $SUMMARY"
          echo
          echo "$DETAILS"
          echo
          echo "Last errors:"
          echo "$LAST_ERRORS"
          echo "========================================"

      # ============================================================
      # TELEGRAM FINAL
      # ============================================================

      - name: Telegram — build completed
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          touch "$STATE_DIR/stop_monitor"

          if [ -f "$STATE_DIR/telegram_monitor_pid" ]; then

            PID="$(
              cat "$STATE_DIR/telegram_monitor_pid"
            )"

            kill "$PID" \
              2>/dev/null ||
              true

          fi

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then
            exit 0
          fi

          START="$(
            cat "$STATE_DIR/build_start" \
            2>/dev/null ||
            date +%s
          )"

          NOW="$(date +%s)"

          TOTAL=$((NOW - START))

          format_time() {

            local S="${1:-0}"

            if [ "$S" -lt 60 ]; then

              printf "%02ds" "$S"

            elif [ "$S" -lt 3600 ]; then

              printf "%02dm %02ds" \
                "$((S / 60))" \
                "$((S % 60))"

            else

              printf "%02dh %02dm %02ds" \
                "$((S / 3600))" \
                "$(((S % 3600) / 60))" \
                "$((S % 60))"

            fi
          }

          escape_html() {
            "$STATE_DIR/tg_escape.sh" "$1"
          }

          if [ "${{ job.status }}" = "success" ]; then

            STATUS="✅ <b>BUILD SUCCESSFUL</b>"

          else

            STATUS="❌ <b>BUILD FAILED</b>"

          fi

          DEVICE="${DEVICE_NAME:-unknown}"

          if [ -f "$STATE_DIR/failure_reason" ]; then

            FAILURE_REASON="$(
              cat "$STATE_DIR/failure_reason"
            )"

          else

            FAILURE_REASON="Build failed. Check GitHub Actions logs."

          fi

          FAILURE_CLASS="${FAILURE_CLASS:-UNKNOWN}"

          if [ -z "$FAILURE_CLASS" ]; then
            FAILURE_CLASS="UNKNOWN"
          fi

          if [ "${#FAILURE_REASON}" -gt 3500 ]; then

            FAILURE_REASON="$(
              printf '%s' "$FAILURE_REASON" |
              tail -c 3500
            )"

          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"

          LOG_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [ "${{ job.status }}" = "success" ]; then

            TEXT="$(
              printf \
                '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n%s\n\n📢 <b>@mkvenompro</b>\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n🖥 Runner: <code>%s</code>\n🔢 MD5: <code>%s</code>\n\n⏱️ <b>Total build time:</b> <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n📦 <a href="%s">GitHub Release</a>\n🔗 <a href="%s">Build Logs</a>' \
                "$STATUS" \
                "$(escape_html "$DEVICE")" \
                "$(escape_html "$FOX_BRANCH")" \
                "$(escape_html "$TARGET")" \
                "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
                "$(escape_html "${MD5_IMG:-N/A}")" \
                "$(format_time "$TOTAL")" \
                "$(escape_html "$OF_MAINTAINER")" \
                "$RELEASE_URL" \
                "$LOG_URL"
            )"

          else

            TEXT="$(
              printf \
                '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n%s\n\n📢 <b>@mkvenompro</b>\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n🖥 Runner: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🧠 <b>SMART FAILURE DETECTION</b>\n\n🔴 Class: <code>%s</code>\n\n<b>Reason:</b>\n<pre>%s</pre>\n\n⏱️ <b>Elapsed:</b> <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n🔗 <a href="%s">Build Logs</a>' \
                "$STATUS" \
                "$(escape_html "$DEVICE")" \
                "$(escape_html "$FOX_BRANCH")" \
                "$(escape_html "$TARGET")" \
                "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
                "$(escape_html "$FAILURE_CLASS")" \
                "$(escape_html "$FAILURE_REASON")" \
                "$(format_time "$TOTAL")" \
                "$(escape_html "$OF_MAINTAINER")" \
                "$LOG_URL"
            )"

          fi

          if [ -n "${OSHI_LINK:-}" ]; then

            TEXT="${TEXT}"$'\n'"☁️ <a href=\"$(escape_html "$OSHI_LINK")\">oshi.at</a>"

          fi

          if [ -n "${GOFILE_LINK:-}" ]; then

            TEXT="${TEXT}"$'\n'"☁️ <a href=\"$(escape_html "$GOFILE_LINK")\">Gofile</a>"

          fi

          RESPONSE="$(
            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${TEXT}" \
              2>&1
          )"

          if echo "$RESPONSE" |
             grep -q '"ok":true'; then

            echo "Telegram final notification sent."

          else

            echo "::warning::Telegram final notification failed."
            echo "$RESPONSE"

          fi

      # ============================================================
      # CCACHE STATISTICS
      # ============================================================

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true

      # ============================================================
      # BUILD SUMMARY
      # ============================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          set +e

          START="$(
            cat "$STATE_DIR/build_start" \
            2>/dev/null ||
            date +%s
          )"

          NOW="$(date +%s)"

          TOTAL=$((NOW - START))

          format_time() {

            local S="${1:-0}"

            if [ "$S" -lt 60 ]; then

              printf "%02ds" "$S"

            elif [ "$S" -lt 3600 ]; then

              printf "%02dm %02ds" \
                "$((S / 60))" \
                "$((S % 60))"

            else

              printf "%02dh %02dm %02ds" \
                "$((S / 3600))" \
                "$(((S % 3600) / 60))" \
                "$((S % 60))"

            fi
          }

          echo
          echo "========================================"
          echo "🦊 MKVenomPro OrangeFox Summary"
          echo "========================================"

          echo "Runner      : ${{ inputs.RUNNER_TYPE }}"
          echo "OrangeFox   : ${FOX_BRANCH:-unknown}"
          echo "Target      : ${TARGET:-unknown}"
          echo "Device      : ${DEVICE_NAME:-unknown}"
          echo "Sync jobs   : ${REPO_SYNC_JOBS:-unknown}"

          echo

          if [ -f "$STATE_DIR/completed_stages" ]; then

            while IFS='|' read -r STAGE STATUS TIME; do

              if [ "$STATUS" = "success" ]; then
                ICON="🟢"
              else
                ICON="🔴"
              fi

              echo "$ICON $STAGE -> $(format_time "$TIME")"

            done < "$STATE_DIR/completed_stages"

          fi

          echo
          echo "⏱️ TOTAL: $(format_time "$TOTAL")"

          if [ -f "$STATE_DIR/failure_reason" ]; then

            echo
            echo "🧠 FAILURE ANALYSIS:"
            cat "$STATE_DIR/failure_reason"

          fi

          echo
          echo "========================================"
