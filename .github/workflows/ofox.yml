name: 🦊 OrangeFox Builder

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: "OrangeFox Manifest Branch"
        required: true
        type: choice
        options:
          - "16.0"
          - "14.1"
          - "12.1"
          - "11.0"
          - "10.0"
          - "9.0"
          - "8.1"
          - "7.1"
          - "6.0"

      DT_REPO_URL:
        description: "Custom Recovery Tree (public or private)"
        required: true
        type: string

      DT_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"
        type: string

      BUILD_TARGET:
        description: "Build Target"
        required: true
        type: choice
        default: "vendorbootimage"
        options:
          - "vendorbootimage"
          - "recoveryimage"
          - "bootimage"

      USE_LATEST_MAGISK:
        description: "Bundle latest Magisk zip?"
        required: true
        type: boolean
        default: true

      UPLOAD_RESULTS:
        description: "Upload result to oshi.at / Gofile?"
        required: true
        type: boolean
        default: true

      LDCHECK:
        description: "Run LDCHECK"
        required: false
        type: boolean
        default: false

      LDCHECKPATH:
        description: "Blob path for LDCHECK"
        required: false
        default: "system/bin/qseecomd"
        type: string

jobs:
  build:
    name: "🦊 fox_${{ inputs.FOX_BRANCH }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 720
    permissions:
      contents: write

    env:
      GT_TOKEN: ${{ secrets.GT_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      OF_MAINTAINER: ${{ github.actor }}
      TARGET: ${{ inputs.BUILD_TARGET }}

    steps:
      # No checkout is required.
      # The previous workflow forced `ref: Builder`, which caused actions/checkout
      # to fail before the actual build whenever that branch did not exist.
      - name: Display inputs
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "        MKVenomPro OrangeFox CI"
          echo "========================================"
          echo "OrangeFox    : ${{ inputs.FOX_BRANCH }}"
          echo "Target       : ${{ inputs.BUILD_TARGET }}"
          echo "Device tree  : ${{ inputs.DT_REPO_URL }}"
          echo "Tree branch  : ${{ inputs.DT_BRANCH }}"
          echo "Magisk       : ${{ inputs.USE_LATEST_MAGISK }}"
          echo "Upload       : ${{ inputs.UPLOAD_RESULTS }}"
          echo "LDCheck      : ${{ inputs.LDCHECK }}"
          echo "Maintainer   : ${{ github.actor }}"
          echo "========================================"

      - name: Parse inputs
        shell: bash
        run: |
          set -euo pipefail

          SYNC_BRANCH="${{ inputs.FOX_BRANCH }}"
          FOX_BRANCH="fox_${SYNC_BRANCH}"
          BRANCH_INT="${SYNC_BRANCH%%.*}"
          SYNC_PATH="${GITHUB_WORKSPACE}/OrangeFox/${FOX_BRANCH}"

          {
            echo "FOX_BRANCH=$FOX_BRANCH"
            echo "SYNC_BRANCH=$SYNC_BRANCH"
            echo "BRANCH_INT=$BRANCH_INT"
            echo "SYNC_PATH=$SYNC_PATH"
            echo "CCACHE_DIR=/tmp/ccache"
          } >> "$GITHUB_ENV"

      - name: Clean up runner disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Add swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install build environment
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            aria2 \
            jq \
            curl \
            wget \
            git \
            ccache \
            patchelf \
            cpio \
            lz4 \
            unzip \
            rsync

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/misc/scripts \
            "$HOME/ofox-scripts"

          cd "$HOME/ofox-scripts"
          sudo bash setup/android_build_env.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ inputs.DT_REPO_URL }}-${{ inputs.FOX_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.DT_REPO_URL }}-${{ inputs.FOX_BRANCH }}-
            ccache-${{ inputs.DT_REPO_URL }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/ccache
          ccache -M 50G
          ccache -z
          ccache -s

      - name: Configure git authentication
        shell: bash
        run: |
          set -e

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

          if [ -n "${GT_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${GT_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

      - name: Telegram — build started
        if: env.TG_TOKEN != '' && env.TG_CHAT_ID != ''
        shell: bash
        run: |
          set +e
          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$(printf \
              '🦊 <b>OrangeFox CI</b>\n\n✔️ Build triggered!\n\n🌿 Branch: <code>%s</code>\n🎯 Target: <code>%s</code>\n👤 Maintainer: %s\n🌲 Logs: https://github.com/%s/actions/runs/%s' \
              "$FOX_BRANCH" "${TARGET}" "${OF_MAINTAINER}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")" \
            >/dev/null

      - name: Clone OrangeFox sync
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"
          cd "${GITHUB_WORKSPACE}/OrangeFox"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}/OrangeFox/sync"

          chmod +x ./orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch "$SYNC_BRANCH" \
            --path "$SYNC_PATH"

      - name: Ensure Guava dependency
        if: inputs.FOX_BRANCH == '14.1' || inputs.FOX_BRANCH == '16.0'
        shell: bash
        run: |
          set -euo pipefail

          cd "$SYNC_PATH"

          if [ -f external/guava/Android.bp ] && \
             grep -q 'name:[[:space:]]*"guava"' external/guava/Android.bp; then
            echo "Guava module already available."
          else
            echo "Guava missing — cloning fallback."
            rm -rf external/guava
            git clone --depth=1 \
              https://android.googlesource.com/platform/external/guava \
              external/guava
          fi

      - name: Clone device tree
        shell: bash
        run: |
          set -euo pipefail

          cd "$SYNC_PATH"

          DT_URL="${{ inputs.DT_REPO_URL }}"
          DT_BRANCH="${{ inputs.DT_BRANCH }}"

          rm -rf device_tree_staging

          echo "Cloning:"
          echo "  $DT_URL"
          echo "  branch: $DT_BRANCH"

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DT_BRANCH" \
            "$DT_URL" \
            device_tree_staging

          cd device_tree_staging

          DEVICE_MAKEFILE=""
          DEVICE_DIRECTORY=""
          DEVICE_NAME=""

          while IFS= read -r -d '' file; do
            PRODUCT_NAME="$(sed -n 's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:?=[[:space:]]*//p' "$file" | head -1)"
            PRODUCT_BRAND="$(sed -n 's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:?=[[:space:]]*//p' "$file" | head -1)"
            PRODUCT_DEVICE="$(sed -n 's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:?=[[:space:]]*//p' "$file" | head -1)"

            if [ -n "$PRODUCT_NAME" ] && \
               [ -n "$PRODUCT_BRAND" ] && \
               [ -n "$PRODUCT_DEVICE" ]; then
              DEVICE_MAKEFILE="$(basename "$file")"
              DEVICE_DIRECTORY="device/$PRODUCT_BRAND"
              DEVICE_NAME="$PRODUCT_DEVICE"
              break
            fi
          done < <(find . -maxdepth 3 -type f -name "*.mk" -print0)

          REPO_BASENAME="$(basename "$DT_URL" .git)"

          if [ -z "$DEVICE_NAME" ]; then
            FALLBACK_BRAND="$(echo "$REPO_BASENAME" | awk -F'_' '{print $(NF-1)}')"
            FALLBACK_DEVICE="$(echo "$REPO_BASENAME" | awk -F'_' '{print $NF}')"

            case "$FALLBACK_BRAND" in
              device|recovery|tree|android|"")
                FALLBACK_BRAND="unknown"
                ;;
            esac

            case "$FALLBACK_DEVICE" in
              device|recovery|tree|android|"")
                FALLBACK_DEVICE="unknown"
                ;;
            esac

            DEVICE_DIRECTORY="device/$FALLBACK_BRAND"
            DEVICE_NAME="$FALLBACK_DEVICE"
          fi

          if [ "$DEVICE_NAME" = "unknown" ]; then
            echo "::error::Could not detect device codename from the supplied tree."
            echo "Add PRODUCT_DEVICE / PRODUCT_BRAND to a .mk file or use a conventional repository name."
            exit 1
          fi

          mkdir -p "$DEVICE_DIRECTORY"

          rm -rf "$DEVICE_DIRECTORY/$DEVICE_NAME"
          mv device_tree_staging "$DEVICE_DIRECTORY/$DEVICE_NAME"

          TREE_PATH="$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"
          COMMIT_ID="$(git -C "$TREE_PATH" rev-parse HEAD)"

          # This old board flag can break newer OrangeFox ramdisk generation.
          if [ -f "$TREE_PATH/BoardConfig.mk" ]; then
            sed -i '/^[[:space:]]*BOARD_RAMDISK_USE_LZ4[[:space:]]*=/d' \
              "$TREE_PATH/BoardConfig.mk" || true
          fi

          {
            echo "DEVICE_NAME=$DEVICE_NAME"
            echo "DEVICE_DIRECTORY=$DEVICE_DIRECTORY"
            echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE"
            echo "DEVICE_TREE_PATH=$TREE_PATH"
            echo "COMMIT_ID=$COMMIT_ID"
          } >> "$GITHUB_ENV"

          echo "========================================"
          echo "Detected device"
          echo "  Device : $DEVICE_NAME"
          echo "  Path   : $DEVICE_DIRECTORY/$DEVICE_NAME"
          echo "  Tree   : $DEVICE_MAKEFILE"
          echo "  Commit : $COMMIT_ID"
          echo "========================================"

      - name: Download latest Magisk
        if: inputs.USE_LATEST_MAGISK == true
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/Magisk"
          cd "$HOME/Magisk"

          API_HEADERS=(-H "Accept: application/vnd.github+json")
          if [ -n "${GT_TOKEN:-}" ]; then
            API_HEADERS+=(-H "Authorization: Bearer ${GT_TOKEN}")
          fi

          RESPONSE="$(curl -fsSL \
            "${API_HEADERS[@]}" \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest)"

          URL="$(echo "$RESPONSE" | jq -r \
            '[.assets[] | select(.name | test("^Magisk-.*\\.apk$")) | .browser_download_url][0]')"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No Magisk APK was found in the latest release."
            echo "$RESPONSE" | jq -r '.assets[].name' || true
            exit 1
          fi

          echo "Downloading: $URL"

          aria2c -x4 -s4 -o magisk.apk "$URL" || \
            curl -fL "$URL" -o magisk.apk

          test -s magisk.apk

          mv magisk.apk Magisk-latest.zip

          echo "FOX_USE_SPECIFIC_MAGISK_ZIP=$HOME/Magisk/Magisk-latest.zip" >> "$GITHUB_ENV"

      - name: Configure LDCHECK
        if: inputs.LDCHECK == true
        shell: bash
        run: |
          set -euo pipefail

          echo "LDCHECK enabled."
          echo "Requested path: ${{ inputs.LDCHECKPATH }}"

          # Keep this as an environment variable so the device tree/build
          # can consume it without hardcoding a specific device.
          {
            echo "LDCHECK_ENABLED=true"
            echo "LDCHECK_PATH=${{ inputs.LDCHECKPATH }}"
          } >> "$GITHUB_ENV"

      - name: Build OrangeFox
        shell: bash
        run: |
          set -euo pipefail

          cd "$SYNC_PATH"

          source build/envsetup.sh

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export OF_MAINTAINER="$OF_MAINTAINER"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_TYPE="Unofficial-CI"
          export LC_ALL=C

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"

          export FOX_MAINTAINER_PATCH_VERSION=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          if [ -n "${FOX_USE_SPECIFIC_MAGISK_ZIP:-}" ]; then
            export FOX_USE_SPECIFIC_MAGISK_ZIP
          fi

          LUNCH_OVERRIDE="$DEVICE_TREE_PATH/lunch_target.txt"

          if [ -f "$LUNCH_OVERRIDE" ]; then
            LUNCH_TARGET="$(tr -d '[:space:]' < "$LUNCH_OVERRIDE")"
          else
            LUNCH_TARGET="twrp_${DEVICE_NAME}-eng"
          fi

          echo "Lunch target: $LUNCH_TARGET"

          lunch "$LUNCH_TARGET"

          make clean
          mka adbd "$TARGET"

      - name: Optional shared-library patch
        shell: bash
        run: |
          set -euo pipefail

          FIX_CONF="$DEVICE_TREE_PATH/lib_fix.conf"

          if [ ! -f "$FIX_CONF" ]; then
            echo "lib_fix.conf not present — skipping patch stage."
            exit 0
          fi

          # shellcheck disable=SC1090
          source "$FIX_CONF"

          LIB="${LIB_NAME:?LIB_NAME missing in lib_fix.conf}"
          SYMBOL="${SYMBOL:?SYMBOL missing in lib_fix.conf}"

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          echo "Library : $LIB"
          echo "Symbol  : $SYMBOL"

          RECOVERY_BIN="$OUT/recovery/root/system/bin/recovery"

          if [ ! -f "$RECOVERY_BIN" ]; then
            echo "::error::Recovery binary not found: $RECOVERY_BIN"
            exit 1
          fi

          mkdir -p "$OUT/recovery/root/vendor/lib64"

          SRC=""

          while IFS= read -r candidate; do
            if [ -f "$candidate" ]; then
              SRC="$candidate"
              break
            fi
          done < <(
            find "$OUT/obj" "$OUT/system" "$OUT/vendor" \
              -type f -name "$LIB" 2>/dev/null | head -20
          )

          if [ -n "$SRC" ] && nm -D "$SRC" 2>/dev/null | grep -q "$SYMBOL"; then
            echo "Using built library: $SRC"
            cp -f "$SRC" "$OUT/recovery/root/vendor/lib64/$LIB"
          else
            DT_LIB="$DEVICE_TREE_PATH/recovery/root/vendor/lib64/$LIB"

            if [ ! -f "$DT_LIB" ]; then
              echo "::error::No valid $LIB containing $SYMBOL was found."
              exit 1
            fi

            echo "Using device-tree prebuilt: $DT_LIB"

            if ! nm -D "$DT_LIB" 2>/dev/null | grep -q "$SYMBOL"; then
              echo "::error::$DT_LIB does not export $SYMBOL"
              exit 1
            fi

            cp -f "$DT_LIB" "$OUT/recovery/root/vendor/lib64/$LIB"
          fi

          echo "Patching recovery DT_NEEDED..."

          if ! patchelf --print-needed "$RECOVERY_BIN" 2>/dev/null | grep -Fxq "$LIB"; then
            patchelf --add-needed "$LIB" "$RECOVERY_BIN"
          fi

          echo "Current dependencies:"
          patchelf --print-needed "$RECOVERY_BIN" | grep -i "${LIB%.so}" || true

          echo "Forcing $TARGET rebuild..."

          rm -f \
            "$OUT/vendor_boot.img" \
            "$OUT/recovery.img" \
            "$OUT/boot.img" \
            "$OUT/ramdisk-recovery.cpio" \
            "$OUT/ramdisk-recovery.img" \
            "$OUT/ramdisk-recovery.cpio.gz" \
            "$OUT/ramdisk-recovery.cpio.lz4" \
            "$OUT/ramdisk-recovery.cpio.lzma" || true

          rm -rf "$OUT/obj/PACKAGING/ramdisk_recovery_intermediates" || true

          touch "$OUT/recovery/root/init"

          cd "$SYNC_PATH"
          mka "$TARGET"

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          case "$TARGET" in
            vendorbootimage)
              IMAGE="$OUT/vendor_boot.img"
              ;;
            recoveryimage)
              IMAGE="$OUT/recovery.img"
              ;;
            bootimage)
              IMAGE="$OUT/boot.img"
              ;;
            *)
              echo "::error::Unsupported target: $TARGET"
              exit 1
              ;;
          esac

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Expected image was not produced: $IMAGE"
            echo "Available output:"
            find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort || true
            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"
          MD5="$(md5sum "$IMAGE" | awk '{print $1}')"

          case "$TARGET" in
            vendorbootimage)
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-vendor_boot.img"
              ;;
            recoveryimage)
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-recovery.img"
              ;;
            bootimage)
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-boot.img"
              ;;
          esac

          cp -f "$IMAGE" "$OUT/$RELEASE_IMAGE"

          {
            echo "OUT_DIR=$OUT"
            echo "IMAGE_PATH=$IMAGE"
            echo "RELEASE_IMAGE=$RELEASE_IMAGE"
            echo "IMAGE_SIZE=$SIZE"
            echo "MD5_IMG=$MD5"
            echo "CHECK_IMG_IS_OK=true"
          } >> "$GITHUB_ENV"

          echo "========================================"
          echo "Build output verified"
          echo "Image : $IMAGE"
          echo "Size  : $SIZE bytes"
          echo "MD5   : $MD5"
          echo "========================================"

      - name: Find OrangeFox ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$OUT_DIR" -maxdepth 1 -type f \
            -iname 'OrangeFox*.zip' -print -quit || true)"

          if [ -n "$ZIP" ]; then
            MD5_ZIP="$(md5sum "$ZIP" | awk '{print $1}')"
            echo "FOX_ZIP=$ZIP" >> "$GITHUB_ENV"
            echo "MD5_ZIP=$MD5_ZIP" >> "$GITHUB_ENV"
            echo "CHECK_ZIP_IS_OK=true" >> "$GITHUB_ENV"
            echo "ZIP found: $ZIP"
          else
            echo "No OrangeFox ZIP generated."
          fi

      - name: Set build metadata
        shell: bash
        run: |
          set -e
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IMAGE_PATH }}
            ${{ env.OUT_DIR }}/${{ env.RELEASE_IMAGE }}
            ${{ env.FOX_ZIP }}
            ${{ env.OUT_DIR }}/ramdisk-recovery.*
          name: "🦊 OrangeFox ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"
          tag_name: "build-${{ github.run_id }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🦊 OrangeFox Recovery — `${{ env.DEVICE_NAME }}`

            | | |
            |---|---|
            | **OrangeFox** | `${{ env.FOX_BRANCH }}` |
            | **Target** | `${{ env.TARGET }}` |
            | **Device tree** | `${{ inputs.DT_REPO_URL }}` |
            | **Tree branch** | `${{ inputs.DT_BRANCH }}` |
            | **Tree commit** | `${{ env.COMMIT_ID }}` |
            | **Maintainer** | `${{ env.OF_MAINTAINER }}` |
            | **Build date** | `${{ env.BUILD_DATE }}` |
            | **Image size** | `${{ env.IMAGE_SIZE }}` bytes |
            | **MD5 (image)** | `${{ env.MD5_IMG }}` |
            | **MD5 (ZIP)** | `${{ env.MD5_ZIP }}` |

      - name: Mirror image to oshi.at
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          FILE="$IMAGE_PATH"

          RESULT="$(curl -skT "$FILE" \
            "https://oshi.at/OrangeFox-${DEVICE_NAME}-${TARGET}.img/20160" \
            2>/dev/null || true)"

          LINK="$(echo "$RESULT" | awk '/DL:/ {print $2; exit}')"

          if [ -n "$LINK" ]; then
            echo "OSHI_LINK=$LINK" >> "$GITHUB_ENV"
            echo "oshi.at: $LINK"
          else
            echo "oshi.at upload returned no download link."
          fi

      - name: Mirror image to Gofile
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          FILE="$IMAGE_PATH"

          SERVER="$(curl -fsSL \
            https://api.gofile.io/servers \
            | jq -r '.data.servers[0].name // empty' 2>/dev/null || true)"

          if [ -z "$SERVER" ]; then
            echo "Could not obtain a Gofile server."
            exit 0
          fi

          RESPONSE="$(curl -fsSL \
            -F "file=@${FILE}" \
            "https://${SERVER}.gofile.io/uploadFile" \
            2>/dev/null || true)"

          LINK="$(echo "$RESPONSE" | jq -r '.data.downloadPage // empty' 2>/dev/null || true)"

          if [ -n "$LINK" ]; then
            echo "GOFILE_LINK=$LINK" >> "$GITHUB_ENV"
            echo "Gofile: $LINK"
          else
            echo "Gofile upload returned no download page."
          fi

      - name: Telegram — build completed
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT_ID != ''
        shell: bash
        run: |
          set +e

          STATUS="❌ FAILED"
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ SUCCESS"
          fi

          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=$(printf \
              '🦊 <b>OrangeFox CI</b>\n\n%s\n\n📱 Device: <code>%s</code>\n🌿 Branch: <code>%s</code>\n🎯 Target: <code>%s</code>\n🔢 MD5: <code>%s</code>\n📦 Release: https://github.com/%s/releases/tag/build-%s' \
              "$STATUS" "$DEVICE_NAME" "$FOX_BRANCH" "$TARGET" "${MD5_IMG:-N/A}" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")" \
            >/dev/null

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true
