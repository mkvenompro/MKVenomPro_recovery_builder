name: 🦊 OrangeFox Builder

on:
  workflow_dispatch:
    inputs:
      FOX_BRANCH:
        description: "OrangeFox Manifest Branch"
        required: true
        type: choice
        options:
          - "16.0"
          - "14.1"
          - "12.1"
          - "11.0"
          - "10.0"
          - "9.0"
          - "8.1"
          - "7.1"
          - "6.0"

      DT_REPO_URL:
        description: "Custom Recovery Tree (public or private)"
        required: true
        type: string

      DT_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"
        type: string

      BUILD_TARGET:
        description: "Build Target"
        required: true
        type: choice
        default: "vendorbootimage"
        options:
          - "vendorbootimage"
          - "recoveryimage"
          - "bootimage"

      USE_LATEST_MAGISK:
        description: "Bundle latest Magisk zip?"
        required: true
        type: boolean
        default: true

      UPLOAD_RESULTS:
        description: "Upload result to oshi.at / Gofile?"
        required: true
        type: boolean
        default: true

      LDCHECK:
        description: "Run LDCHECK"
        required: false
        type: boolean
        default: false

      LDCHECKPATH:
        description: "Blob path for LDCHECK"
        required: false
        default: "system/bin/qseecomd"
        type: string

      RUNNER_TYPE:
        description: "Runner"
        required: true
        type: choice
        default: "github"
        options:
          - "github"
          - "self-hosted"

      SELF_HOSTED_LABEL:
        description: "Self-hosted runner label"
        required: false
        default: "self-hosted"
        type: string

      CCACHE_SIZE:
        description: "ccache max size"
        required: true
        type: choice
        default: "50G"
        options:
          - "20G"
          - "50G"
          - "80G"
          - "100G"
          - "150G"
          - "200G"

jobs:
  build:
    name: "🦊 fox_${{ inputs.FOX_BRANCH }}"

    runs-on: ${{ inputs.RUNNER_TYPE == 'self-hosted' && inputs.SELF_HOSTED_LABEL || 'ubuntu-22.04' }}

    timeout-minutes: 720

    permissions:
      contents: write

    env:
      GT_TOKEN: ${{ secrets.GT_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      OF_MAINTAINER: ${{ github.actor }}
      TARGET: ${{ inputs.BUILD_TARGET }}

    steps:

      # ============================================================
      # INITIALIZE
      # ============================================================

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Initialize build state
        shell: bash
        run: |
          set -euo pipefail

          STATE_DIR="${RUNNER_TEMP}/mkvenompro-build-state"
          mkdir -p "$STATE_DIR"

          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"

          date +%s > "$STATE_DIR/build_start"

          cat > "$STATE_DIR/stages" <<'EOF'
          Prepare environment|⏳|0|0
          Configure ccache|⏳|0|0
          Configure git|⏳|0|0
          Clone OrangeFox sync|⏳|0|0
          Repair self-hosted tree|⏳|0|0
          Sync OrangeFox sources|⏳|0|0
          Ensure dependencies|⏳|0|0
          Clone device tree|⏳|0|0
          Download Magisk|⏳|0|0
          Configure LDCHECK|⏳|0|0
          Build OrangeFox|⏳|0|0
          Optional library patch|⏳|0|0
          Validate output|⏳|0|0
          Find ZIP|⏳|0|0
          GitHub Release|⏳|0|0
          Upload mirrors|⏳|0|0
          EOF

          echo "CURRENT_STAGE=Initializing" >> "$GITHUB_ENV"
          echo "FAILED_STAGE=" >> "$GITHUB_ENV"
          echo "BUILD_FAILED_REASON=" >> "$GITHUB_ENV"

          touch "$STATE_DIR/current_stage"
          touch "$STATE_DIR/failure_reason"
          touch "$STATE_DIR/current_stage_start"

      - name: Display inputs
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "        MKVenomPro OrangeFox CI"
          echo "========================================"
          echo "OrangeFox    : ${{ inputs.FOX_BRANCH }}"
          echo "Target       : ${{ inputs.BUILD_TARGET }}"
          echo "Device tree  : ${{ inputs.DT_REPO_URL }}"
          echo "Tree branch  : ${{ inputs.DT_BRANCH }}"
          echo "Magisk       : ${{ inputs.USE_LATEST_MAGISK }}"
          echo "ccache size  : ${{ inputs.CCACHE_SIZE }}"
          echo "Upload       : ${{ inputs.UPLOAD_RESULTS }}"
          echo "LDCheck      : ${{ inputs.LDCHECK }}"
          echo "Runner       : ${{ inputs.RUNNER_TYPE }}"
          echo "Maintainer   : ${{ github.actor }}"
          echo "========================================"

      - name: Parse inputs
        shell: bash
        run: |
          set -euo pipefail

          SYNC_BRANCH="${{ inputs.FOX_BRANCH }}"
          FOX_BRANCH="fox_${SYNC_BRANCH}"
          BRANCH_INT="${SYNC_BRANCH%%.*}"
          SYNC_PATH="${GITHUB_WORKSPACE}/OrangeFox/${FOX_BRANCH}"

          {
            echo "FOX_BRANCH=$FOX_BRANCH"
            echo "SYNC_BRANCH=$SYNC_BRANCH"
            echo "BRANCH_INT=$BRANCH_INT"
            echo "SYNC_PATH=$SYNC_PATH"
          } >> "$GITHUB_ENV"

      # ============================================================
      # TELEGRAM LIVE MONITOR
      # ============================================================

      - name: Start Telegram live monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then
            echo "Telegram disabled."
            exit 0
          fi

          mkdir -p "$STATE_DIR"

          NOW="$(date +%s)"
          echo "$NOW" > "$STATE_DIR/build_start"

          escape_html() {
            printf '%s' "$1" \
              | sed \
                -e 's/&/\&amp;/g' \
                -e 's/</\&lt;/g' \
                -e 's/>/\&gt;/g'
          }

          format_time() {
            local S="${1:-0}"

            if [ "$S" -lt 60 ]; then
              printf "%02ds" "$S"
            elif [ "$S" -lt 3600 ]; then
              printf "%02dm %02ds" "$((S / 60))" "$((S % 60))"
            else
              printf "%02dh %02dm %02ds" \
                "$((S / 3600))" \
                "$(((S % 3600) / 60))" \
                "$((S % 60))"
            fi
          }

          DEVICE="pending"
          if [ -n "${DEVICE_NAME:-}" ]; then
            DEVICE="$DEVICE_NAME"
          fi

          START_TEXT="$(printf \
            '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n🚀 <b>BUILD STARTED</b>\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n🌲 Tree: <code>%s</code>\n🌿 Tree branch: <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n🔵 <b>Current stage:</b> Initializing\n⏱️ Total elapsed: <code>00s</code>\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
            "$DEVICE" \
            "${FOX_BRANCH:-unknown}" \
            "${TARGET:-unknown}" \
            "${{ inputs.DT_REPO_URL }}" \
            "${{ inputs.DT_BRANCH }}" \
            "${OF_MAINTAINER:-unknown}" \
            "${GITHUB_REPOSITORY}" \
            "${GITHUB_RUN_ID}")"

          RESPONSE="$(curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${START_TEXT}" 2>&1)"

          MESSAGE_ID="$(echo "$RESPONSE" | jq -r '.result.message_id // empty' 2>/dev/null)"

          if [ -z "$MESSAGE_ID" ]; then
            echo "::warning::Could not create Telegram live message."
            exit 0
          fi

          echo "$MESSAGE_ID" > "$STATE_DIR/telegram_message_id"

          (
            while true; do

              sleep 15

              [ -f "$STATE_DIR/stop_monitor" ] && break

              START="$(cat "$STATE_DIR/build_start" 2>/dev/null || date +%s)"
              NOW="$(date +%s)"
              TOTAL=$((NOW - START))

              STAGE="$(cat "$STATE_DIR/current_stage" 2>/dev/null || echo "Initializing")"
              STAGE_START="$(cat "$STATE_DIR/current_stage_start" 2>/dev/null || echo "$NOW")"
              STAGE_TIME=$((NOW - STAGE_START))

              DEVICE="$(cat "$STATE_DIR/device" 2>/dev/null || echo "detecting...")"

              STAGE_ESC="$(escape_html "$STAGE")"
              DEVICE_ESC="$(escape_html "$DEVICE")"

              TEXT="$(printf \
                '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n🔵 <b>BUILDING</b>\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔵 <b>CURRENT STAGE</b>\n🏗️ %s\n⏱️ Stage elapsed: <code>%s</code>\n⏱️ Total elapsed: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
                "$DEVICE_ESC" \
                "${FOX_BRANCH:-unknown}" \
                "${TARGET:-unknown}" \
                "$STAGE_ESC" \
                "$(format_time "$STAGE_TIME")" \
                "$(format_time "$TOTAL")" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_RUN_ID}")"

              curl -sS -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/editMessageText" \
                -d "chat_id=${TG_CHAT_ID}" \
                -d "message_id=$(cat "$STATE_DIR/telegram_message_id")" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=${TEXT}" \
                >/dev/null 2>&1 || true

            done
          ) &

          echo $! > "$STATE_DIR/telegram_monitor_pid"

      # ============================================================
      # STAGE HELPER
      # ============================================================

      - name: Prepare stage helper
        shell: bash
        run: |
          set -euo pipefail

          cat > "$STATE_DIR/stage_start.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"

          NOW="$(date +%s)"

          echo "$STAGE" > "$STATE_DIR/current_stage"
          echo "$NOW" > "$STATE_DIR/current_stage_start"

          case "$STAGE" in
            "Prepare environment")
              ;;
          esac

          echo "========================================"
          echo "🔵 STAGE: $STAGE"
          echo "🕐 Started: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "========================================"
          EOF

          chmod +x "$STATE_DIR/stage_start.sh"

          cat > "$STATE_DIR/stage_end.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"
          STATUS="${2:-success}"

          NOW="$(date +%s)"
          START="$(cat "$STATE_DIR/current_stage_start" 2>/dev/null || echo "$NOW")"
          ELAPSED=$((NOW - START))

          echo "STAGE_END=$STAGE|$STATUS|$ELAPSED" >> "$STATE_DIR/completed_stages"

          if [ "$STATUS" = "success" ]; then
            echo "🟢 STAGE COMPLETE: $STAGE"
            echo "⏱️ Duration: ${ELAPSED}s"
          else
            echo "🔴 STAGE FAILED: $STAGE"
            echo "⏱️ Duration: ${ELAPSED}s"
          fi
          EOF

          chmod +x "$STATE_DIR/stage_end.sh"

      # ============================================================
      # ENVIRONMENT
      # ============================================================

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Prepare environment"

          sudo apt-get update -qq

          sudo apt-get install -y \
            aria2 \
            jq \
            curl \
            wget \
            git \
            ccache \
            patchelf \
            cpio \
            lz4 \
            unzip \
            rsync

          if [ -d "$HOME/ofox-scripts/.git" ]; then
            cd "$HOME/ofox-scripts"
            git fetch --depth=1 origin
            git reset --hard origin/HEAD
          else
            rm -rf "$HOME/ofox-scripts"

            git clone --depth=1 \
              https://gitlab.com/OrangeFox/misc/scripts \
              "$HOME/ofox-scripts"
          fi

          cd "$HOME/ofox-scripts"

          sudo bash setup/android_build_env.sh

          "$STATE_DIR/stage_end.sh" "Prepare environment" success

      # ============================================================
      # CCACHE FIX
      # ============================================================

      - name: Configure writable ccache location
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Configure ccache"

          CANDIDATES=(
            "${RUNNER_TEMP}/mkvenompro-ccache"
            "${GITHUB_WORKSPACE}/.ccache"
            "${HOME}/.cache/ccache"
          )

          CCACHE_SELECTED=""

          for DIR in "${CANDIDATES[@]}"; do

            mkdir -p "$DIR" 2>/dev/null || continue

            TEST_FILE="$DIR/.mkvenompro_write_test"

            if touch "$TEST_FILE" 2>/dev/null; then
              rm -f "$TEST_FILE"
              CCACHE_SELECTED="$DIR"
              break
            fi

          done

          if [ -z "$CCACHE_SELECTED" ]; then
            echo "::error::No writable location was found for ccache."
            echo "RUNNER_TEMP=$RUNNER_TEMP"
            echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            echo "HOME=$HOME"
            exit 1
          fi

          echo "Using writable ccache directory:"
          echo "$CCACHE_SELECTED"

          export CCACHE_DIR="$CCACHE_SELECTED"

          {
            echo "CCACHE_DIR=$CCACHE_SELECTED"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
          } >> "$GITHUB_ENV"

          ccache -M "${{ inputs.CCACHE_SIZE }}"
          ccache -z
          ccache -s

          "$STATE_DIR/stage_end.sh" "Configure ccache" success

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.DT_REPO_URL }}-${{ inputs.FOX_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.DT_REPO_URL }}-${{ inputs.FOX_BRANCH }}-
            ccache-${{ runner.os }}-${{ inputs.DT_REPO_URL }}-
            ccache-${{ runner.os }}-

      # ============================================================
      # GIT
      # ============================================================

      - name: Configure git authentication
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Configure git"

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --global color.ui false

          if [ -n "${GT_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${GT_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          "$STATE_DIR/stage_end.sh" "Configure git" success

      # ============================================================
      # ORANGEFOX SYNC
      # ============================================================

      - name: Clone OrangeFox sync
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Clone OrangeFox sync"

          mkdir -p "${GITHUB_WORKSPACE}/OrangeFox"

          cd "${GITHUB_WORKSPACE}/OrangeFox"

          if [ -d "sync/.git" ]; then

            echo "OrangeFox/sync already exists."

            cd sync

            git fetch --depth=1 origin
            git reset --hard origin/HEAD

          else

            rm -rf sync

            git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/sync.git

          fi

          "$STATE_DIR/stage_end.sh" "Clone OrangeFox sync" success

      # ============================================================
      # SELF HOSTED REPAIR
      # ============================================================

      - name: Repair corrupted repo checkouts
        if: inputs.RUNNER_TYPE == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Repair self-hosted tree"

          if [ -d "$SYNC_PATH/.repo" ]; then

            echo "Checking existing source tree..."

            cd "$SYNC_PATH"

            repo forall -c '
              if ! git status >/dev/null 2>&1; then
                echo "Corrupted checkout: $REPO_PATH"
                rm -rf "$REPO_PATH"
              fi
            ' 2>&1 || true

          else

            echo "No existing source tree."

          fi

          "$STATE_DIR/stage_end.sh" "Repair self-hosted tree" success

      - name: Reset locally patched files
        if: inputs.RUNNER_TYPE == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$SYNC_PATH/.repo" ]; then

            cd "$SYNC_PATH"

            repo forall -c '
              git checkout -f -- . >/dev/null 2>&1 || true
              git clean -fd >/dev/null 2>&1 || true
            ' 2>&1 || true

          fi

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Sync OrangeFox sources"

          cd "${GITHUB_WORKSPACE}/OrangeFox/sync"

          chmod +x ./orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch "$SYNC_BRANCH" \
            --path "$SYNC_PATH"

          "$STATE_DIR/stage_end.sh" "Sync OrangeFox sources" success

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Ensure Guava dependency
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Ensure dependencies"

          if [ "${{ inputs.FOX_BRANCH }}" = "14.1" ] || \
             [ "${{ inputs.FOX_BRANCH }}" = "16.0" ]; then

            cd "$SYNC_PATH"

            if [ -f external/guava/Android.bp ] && \
               grep -q 'name:[[:space:]]*"guava"' external/guava/Android.bp; then

              echo "Guava already available."

            else

              echo "Guava missing. Cloning fallback."

              rm -rf external/guava

              git clone \
                --depth=1 \
                https://android.googlesource.com/platform/external/guava \
                external/guava

            fi

          else

            echo "Guava fallback not required."

          fi

          "$STATE_DIR/stage_end.sh" "Ensure dependencies" success

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Clone device tree
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Clone device tree"

          cd "$SYNC_PATH"

          DT_URL="${{ inputs.DT_REPO_URL }}"
          DT_BRANCH="${{ inputs.DT_BRANCH }}"

          rm -rf device_tree_staging

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DT_BRANCH" \
            "$DT_URL" \
            device_tree_staging

          STAGING_PATH="$SYNC_PATH/device_tree_staging"

          cd "$STAGING_PATH"

          DEVICE_MAKEFILE=""
          DEVICE_DIRECTORY=""
          DEVICE_NAME=""

          while IFS= read -r -d '' file; do

            PRODUCT_NAME="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_NAME[[:space:]]*:?=[[:space:]]*//p' \
                "$file" \
                | head -1
            )"

            PRODUCT_BRAND="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_BRAND[[:space:]]*:?=[[:space:]]*//p' \
                "$file" \
                | head -1
            )"

            PRODUCT_DEVICE="$(
              sed -n \
                's/^[[:space:]]*PRODUCT_DEVICE[[:space:]]*:?=[[:space:]]*//p' \
                "$file" \
                | head -1
            )"

            if [ -n "$PRODUCT_NAME" ] && \
               [ -n "$PRODUCT_BRAND" ] && \
               [ -n "$PRODUCT_DEVICE" ]; then

              DEVICE_MAKEFILE="$(basename "$file")"
              DEVICE_DIRECTORY="device/$PRODUCT_BRAND"
              DEVICE_NAME="$PRODUCT_DEVICE"

              break
            fi

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.mk" \
              -print0
          )

          REPO_BASENAME="$(basename "$DT_URL" .git)"

          if [ -z "$DEVICE_NAME" ]; then

            FALLBACK_BRAND="$(
              echo "$REPO_BASENAME" \
                | awk -F'_' '{print $(NF-1)}'
            )"

            FALLBACK_DEVICE="$(
              echo "$REPO_BASENAME" \
                | awk -F'_' '{print $NF}'
            )"

            case "$FALLBACK_BRAND" in
              device|recovery|tree|android|"")
                FALLBACK_BRAND="unknown"
                ;;
            esac

            case "$FALLBACK_DEVICE" in
              device|recovery|tree|android|"")
                FALLBACK_DEVICE="unknown"
                ;;
            esac

            DEVICE_DIRECTORY="device/$FALLBACK_BRAND"
            DEVICE_NAME="$FALLBACK_DEVICE"

          fi

          if [ "$DEVICE_NAME" = "unknown" ]; then
            echo "::error::Could not detect device codename."
            exit 1
          fi

          mkdir -p "$SYNC_PATH/$DEVICE_DIRECTORY"

          rm -rf \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          mv \
            "$STAGING_PATH" \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          TREE_PATH="$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"

          COMMIT_ID="$(
            git -C "$TREE_PATH" rev-parse HEAD
          )"

          if [ ! -f "$TREE_PATH/vendorsetup.sh" ]; then
            touch "$TREE_PATH/vendorsetup.sh"
          fi

          if [ -f "$TREE_PATH/BoardConfig.mk" ]; then
            sed -i \
              '/^[[:space:]]*BOARD_RAMDISK_USE_LZ4[[:space:]]*=/d' \
              "$TREE_PATH/BoardConfig.mk" \
              || true
          fi

          {
            echo "DEVICE_NAME=$DEVICE_NAME"
            echo "DEVICE_DIRECTORY=$DEVICE_DIRECTORY"
            echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE"
            echo "DEVICE_TREE_PATH=$TREE_PATH"
            echo "COMMIT_ID=$COMMIT_ID"
          } >> "$GITHUB_ENV"

          echo "$DEVICE_NAME" > "$STATE_DIR/device"

          echo "========================================"
          echo "Detected device"
          echo "Device : $DEVICE_NAME"
          echo "Path   : $DEVICE_DIRECTORY/$DEVICE_NAME"
          echo "Tree   : $DEVICE_MAKEFILE"
          echo "Commit : $COMMIT_ID"
          echo "========================================"

          "$STATE_DIR/stage_end.sh" "Clone device tree" success

      # ============================================================
      # MAGISK
      # ============================================================

      - name: Download latest Magisk
        if: inputs.USE_LATEST_MAGISK == true
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Download Magisk"

          mkdir -p "$HOME/Magisk"

          cd "$HOME/Magisk"

          API_HEADERS=(
            -H "Accept: application/vnd.github+json"
          )

          if [ -n "${GT_TOKEN:-}" ]; then
            API_HEADERS+=(
              -H "Authorization: Bearer ${GT_TOKEN}"
            )
          fi

          RESPONSE="$(
            curl -fsSL \
              "${API_HEADERS[@]}" \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          )"

          URL="$(
            echo "$RESPONSE" \
              | jq -r \
                '[.assets[]
                  | select(.name | test("^Magisk-.*\\.apk$"))
                  | .browser_download_url][0]'
          )"

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::No Magisk APK found."
            exit 1
          fi

          aria2c \
            -x4 \
            -s4 \
            -o magisk.apk \
            "$URL" \
            || curl -fL "$URL" -o magisk.apk

          test -s magisk.apk

          mv \
            magisk.apk \
            Magisk-latest.zip

          echo \
            "FOX_USE_SPECIFIC_MAGISK_ZIP=$HOME/Magisk/Magisk-latest.zip" \
            >> "$GITHUB_ENV"

          "$STATE_DIR/stage_end.sh" "Download Magisk" success

      # ============================================================
      # LDCHECK
      # ============================================================

      - name: Configure LDCHECK
        if: inputs.LDCHECK == true
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Configure LDCHECK"

          {
            echo "LDCHECK_ENABLED=true"
            echo "LDCHECK_PATH=${{ inputs.LDCHECKPATH }}"
          } >> "$GITHUB_ENV"

          "$STATE_DIR/stage_end.sh" "Configure LDCHECK" success

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        run: |
          set -o pipefail

          "$STATE_DIR/stage_start.sh" "Build OrangeFox"

          cd "$SYNC_PATH"

          BUILD_LOG="$STATE_DIR/build.log"

          set +e
          set +u

          export ZSH_VERSION=""

          source build/envsetup.sh \
            > >(tee -a "$BUILD_LOG") \
            2> >(tee -a "$BUILD_LOG" >&2)

          SOURCE_STATUS=$?

          if [ "$SOURCE_STATUS" -ne 0 ]; then
            echo "::error::build/envsetup.sh failed."

            tail -n 120 "$BUILD_LOG" || true

            {
              echo "Build OrangeFox"
              echo "build/envsetup.sh failed with exit code $SOURCE_STATUS"
            } > "$STATE_DIR/failure_reason"

            exit "$SOURCE_STATUS"
          fi

          export FOX_BUILD_DEVICE="$DEVICE_NAME"
          export OF_MAINTAINER="$OF_MAINTAINER"
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          export FOX_BUILD_TYPE="Unofficial-CI"
          export LC_ALL=C

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"

          export FOX_MAINTAINER_PATCH_VERSION=1
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1

          if [ -n "${FOX_USE_SPECIFIC_MAGISK_ZIP:-}" ]; then
            export FOX_USE_SPECIFIC_MAGISK_ZIP
          fi

          LUNCH_OVERRIDE="$DEVICE_TREE_PATH/lunch_target.txt"

          if [ -f "$LUNCH_OVERRIDE" ]; then
            LUNCH_TARGET="$(
              tr -d '[:space:]' < "$LUNCH_OVERRIDE"
            )
          else
            LUNCH_TARGET="twrp_${DEVICE_NAME}-eng"
          fi

          echo "Lunch target: $LUNCH_TARGET"

          lunch "$LUNCH_TARGET" \
            2>&1 | tee -a "$BUILD_LOG"

          LUNCH_STATUS=${PIPESTATUS[0]}

          if [ "$LUNCH_STATUS" -ne 0 ]; then
            echo "::error::lunch failed."

            tail -n 150 "$BUILD_LOG" || true

            echo \
              "lunch failed with exit code $LUNCH_STATUS" \
              > "$STATE_DIR/failure_reason"

            exit "$LUNCH_STATUS"
          fi

          make clean \
            2>&1 | tee -a "$BUILD_LOG"

          CLEAN_STATUS=${PIPESTATUS[0]}

          if [ "$CLEAN_STATUS" -ne 0 ]; then
            echo "::error::make clean failed."

            tail -n 150 "$BUILD_LOG" || true

            echo \
              "make clean failed with exit code $CLEAN_STATUS" \
              > "$STATE_DIR/failure_reason"

            exit "$CLEAN_STATUS"
          fi

          echo "Starting OrangeFox compilation..."

          mka adbd "$TARGET" \
            2>&1 | tee -a "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then

            echo "::error::OrangeFox build failed."

            FAILURE_LINE="$(
              grep -E \
                '(^FAILED:|error:|Error:|fatal:|ccache: error|ninja: build stopped|FAILED)' \
                "$BUILD_LOG" \
                | tail -n 1 \
                || true
            )"

            if [ -z "$FAILURE_LINE" ]; then
              FAILURE_LINE="Build failed with exit code $BUILD_STATUS"
            fi

            echo "$FAILURE_LINE" > "$STATE_DIR/failure_reason"

            echo "========================================"
            echo "LAST BUILD ERROR"
            echo "$FAILURE_LINE"
            echo "========================================"

            tail -n 120 "$BUILD_LOG" || true

            exit "$BUILD_STATUS"
          fi

          "$STATE_DIR/stage_end.sh" "Build OrangeFox" success

      # ============================================================
      # OPTIONAL PATCH
      # ============================================================

      - name: Optional shared-library patch
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Optional library patch"

          FIX_CONF="$DEVICE_TREE_PATH/lib_fix.conf"

          if [ ! -f "$FIX_CONF" ]; then
            echo "lib_fix.conf not present — skipping patch stage."
            "$STATE_DIR/stage_end.sh" "Optional library patch" success
            exit 0
          fi

          source "$FIX_CONF"

          LIB="${LIB_NAME:?LIB_NAME missing in lib_fix.conf}"
          SYMBOL="${SYMBOL:?SYMBOL missing in lib_fix.conf}"

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          RECOVERY_BIN="$OUT/recovery/root/system/bin/recovery"

          if [ ! -f "$RECOVERY_BIN" ]; then
            echo "::error::Recovery binary not found."
            exit 1
          fi

          mkdir -p \
            "$OUT/recovery/root/vendor/lib64"

          SRC=""

          while IFS= read -r candidate; do

            if [ -f "$candidate" ]; then
              SRC="$candidate"
              break
            fi

          done < <(
            find \
              "$OUT/obj" \
              "$OUT/system" \
              "$OUT/vendor" \
              -type f \
              -name "$LIB" \
              2>/dev/null \
              | head -20
          )

          if [ -n "$SRC" ] && \
             nm -D "$SRC" 2>/dev/null | grep -q "$SYMBOL"; then

            cp -f \
              "$SRC" \
              "$OUT/recovery/root/vendor/lib64/$LIB"

          else

            DT_LIB="$DEVICE_TREE_PATH/recovery/root/vendor/lib64/$LIB"

            if [ ! -f "$DT_LIB" ]; then
              echo "::error::No valid $LIB containing $SYMBOL was found."
              exit 1
            fi

            if ! nm -D "$DT_LIB" 2>/dev/null | grep -q "$SYMBOL"; then
              echo "::error::$DT_LIB does not export $SYMBOL"
              exit 1
            fi

            cp -f \
              "$DT_LIB" \
              "$OUT/recovery/root/vendor/lib64/$LIB"

          fi

          if ! patchelf \
              --print-needed "$RECOVERY_BIN" \
              2>/dev/null \
              | grep -Fxq "$LIB"; then

            patchelf \
              --add-needed "$LIB" \
              "$RECOVERY_BIN"

          fi

          rm -f \
            "$OUT/vendor_boot.img" \
            "$OUT/recovery.img" \
            "$OUT/boot.img" \
            "$OUT/ramdisk-recovery.cpio" \
            "$OUT/ramdisk-recovery.img" \
            "$OUT/ramdisk-recovery.cpio.gz" \
            "$OUT/ramdisk-recovery.cpio.lz4" \
            "$OUT/ramdisk-recovery.cpio.lzma" \
            || true

          rm -rf \
            "$OUT/obj/PACKAGING/ramdisk_recovery_intermediates" \
            || true

          touch "$OUT/recovery/root/init"

          cd "$SYNC_PATH"

          mka "$TARGET"

          "$STATE_DIR/stage_end.sh" "Optional library patch" success

      # ============================================================
      # VALIDATE
      # ============================================================

      - name: Validate build output
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Validate output"

          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"

          case "$TARGET" in

            vendorbootimage)
              IMAGE="$OUT/vendor_boot.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-vendor_boot.img"
              ;;

            recoveryimage)
              IMAGE="$OUT/recovery.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-recovery.img"
              ;;

            bootimage)
              IMAGE="$OUT/boot.img"
              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-boot.img"
              ;;

            *)
              echo "::error::Unsupported target: $TARGET"
              exit 1
              ;;

          esac

          if [ ! -f "$IMAGE" ]; then

            echo "::error::Expected image was not produced: $IMAGE"

            find "$OUT" \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort \
              || true

            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"
          MD5="$(md5sum "$IMAGE" | awk '{print $1}')"

          cp -f \
            "$IMAGE" \
            "$OUT/$RELEASE_IMAGE"

          {
            echo "OUT_DIR=$OUT"
            echo "IMAGE_PATH=$IMAGE"
            echo "RELEASE_IMAGE=$RELEASE_IMAGE"
            echo "IMAGE_SIZE=$SIZE"
            echo "MD5_IMG=$MD5"
            echo "CHECK_IMG_IS_OK=true"
          } >> "$GITHUB_ENV"

          echo "========================================"
          echo "Build output verified"
          echo "Image : $IMAGE"
          echo "Size  : $SIZE bytes"
          echo "MD5   : $MD5"
          echo "========================================"

          "$STATE_DIR/stage_end.sh" "Validate output" success

      # ============================================================
      # ZIP
      # ============================================================

      - name: Find OrangeFox ZIP
        shell: bash
        run: |
          set -euo pipefail

          "$STATE_DIR/stage_start.sh" "Find ZIP"

          ZIP="$(
            find "$OUT_DIR" \
              -maxdepth 1 \
              -type f \
              -iname 'OrangeFox*.zip' \
              -print \
              -quit \
              || true
          )"

          if [ -n "$ZIP" ]; then

            MD5_ZIP="$(
              md5sum "$ZIP" \
                | awk '{print $1}'
            )"

            echo "FOX_ZIP=$ZIP" >> "$GITHUB_ENV"
            echo "MD5_ZIP=$MD5_ZIP" >> "$GITHUB_ENV"
            echo "CHECK_ZIP_IS_OK=true" >> "$GITHUB_ENV"

            echo "ZIP found: $ZIP"

          else

            echo "No OrangeFox ZIP generated."

          fi

          "$STATE_DIR/stage_end.sh" "Find ZIP" success

      # ============================================================
      # METADATA
      # ============================================================

      - name: Set build metadata
        shell: bash
        run: |
          set -euo pipefail

          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      # ============================================================
      # GITHUB RELEASE
      # ============================================================

      - name: Upload to GitHub Release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IMAGE_PATH }}
            ${{ env.OUT_DIR }}/${{ env.RELEASE_IMAGE }}
            ${{ env.FOX_ZIP }}
            ${{ env.OUT_DIR }}/ramdisk-recovery.*
          name: "🦊 OrangeFox ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"
          tag_name: "build-${{ github.run_id }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 🦊 OrangeFox Recovery — `${{ env.DEVICE_NAME }}`

            | | |
            |---|---|
            | **OrangeFox** | `${{ env.FOX_BRANCH }}` |
            | **Target** | `${{ env.TARGET }}` |
            | **Device tree** | `${{ inputs.DT_REPO_URL }}` |
            | **Tree branch** | `${{ inputs.DT_BRANCH }}` |
            | **Tree commit** | `${{ env.COMMIT_ID }}` |
            | **Maintainer** | `${{ env.OF_MAINTAINER }}` |
            | **Build date** | `${{ env.BUILD_DATE }}` |
            | **Image size** | `${{ env.IMAGE_SIZE }}` bytes |
            | **MD5 (image)** | `${{ env.MD5_IMG }}` |
            | **MD5 (ZIP)** | `${{ env.MD5_ZIP }}` |

      # ============================================================
      # MIRRORS
      # ============================================================

      - name: Mirror image to oshi.at
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          "$STATE_DIR/stage_start.sh" "Upload mirrors"

          FILE="$IMAGE_PATH"

          RESULT="$(
            curl -skT "$FILE" \
              "https://oshi.at/OrangeFox-${DEVICE_NAME}-${TARGET}.img/20160" \
              2>/dev/null \
              || true
          )"

          LINK="$(
            echo "$RESULT" \
              | awk '/DL:/ {print $2; exit}'
          )"

          if [ -n "$LINK" ]; then
            echo "OSHI_LINK=$LINK" >> "$GITHUB_ENV"
            echo "oshi.at: $LINK"
          else
            echo "oshi.at upload returned no link."
          fi

      - name: Mirror image to Gofile
        if: env.CHECK_IMG_IS_OK == 'true' && inputs.UPLOAD_RESULTS == true
        continue-on-error: true
        shell: bash
        run: |
          set -u

          FILE="$IMAGE_PATH"

          SERVER="$(
            curl -fsSL \
              https://api.gofile.io/servers \
              | jq -r \
                '.data.servers[0].name // empty' \
              2>/dev/null \
              || true
          )"

          if [ -z "$SERVER" ]; then
            echo "Could not obtain Gofile server."
            exit 0
          fi

          RESPONSE="$(
            curl -fsSL \
              -F "file=@${FILE}" \
              "https://${SERVER}.gofile.io/uploadFile" \
              2>/dev/null \
              || true
          )"

          LINK="$(
            echo "$RESPONSE" \
              | jq -r \
                '.data.downloadPage // empty' \
              2>/dev/null \
              || true
          )"

          if [ -n "$LINK" ]; then
            echo "GOFILE_LINK=$LINK" >> "$GITHUB_ENV"
            echo "Gofile: $LINK"
          fi

          "$STATE_DIR/stage_end.sh" "Upload mirrors" success

      # ============================================================
      # FINAL TELEGRAM
      # ============================================================

      - name: Telegram — final build report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          touch "$STATE_DIR/stop_monitor"

          if [ -f "$STATE_DIR/telegram_monitor_pid" ]; then
            PID="$(cat "$STATE_DIR/telegram_monitor_pid")"
            kill "$PID" 2>/dev/null || true
          fi

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then
            exit 0
          fi

          START="$(cat "$STATE_DIR/build_start" 2>/dev/null || date +%s)"
          NOW="$(date +%s)"
          TOTAL=$((NOW - START))

          format_time() {
            local S="${1:-0}"

            if [ "$S" -lt 60 ]; then
              printf "%02ds" "$S"
            elif [ "$S" -lt 3600 ]; then
              printf "%02dm %02ds" \
                "$((S / 60))" \
                "$((S % 60))"
            else
              printf "%02dh %02dm %02ds" \
                "$((S / 3600))" \
                "$(((S % 3600) / 60))" \
                "$((S % 60))"
            fi
          }

          JOB_STATUS="${{ job.status }}"

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="✅ <b>BUILD SUCCESSFUL</b>"
          else
            STATUS="❌ <b>BUILD FAILED</b>"
          fi

          DEVICE="${DEVICE_NAME:-unknown}"

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/build-${GITHUB_RUN_ID}"
          LOG_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          FAILURE_REASON=""

          if [ -f "$STATE_DIR/failure_reason" ]; then
            FAILURE_REASON="$(
              cat "$STATE_DIR/failure_reason" \
                | tail -n 5
            )"
          fi

          if [ -z "$FAILURE_REASON" ] && \
             [ "$JOB_STATUS" != "success" ]; then

            FAILURE_REASON="Build failed. Check GitHub Actions logs."

          fi

          STAGE_LIST=""

          if [ -f "$STATE_DIR/completed_stages" ]; then

            while IFS='|' read -r PREFIX NAME STAGE_STATUS TIME; do

              [ -z "$NAME" ] && continue

              if [ "$STAGE_STATUS" = "success" ]; then
                ICON="✅"
              else
                ICON="❌"
              fi

              STAGE_LIST="${STAGE_LIST}${ICON} ${NAME} — $(format_time "$TIME")\n"

            done < "$STATE_DIR/completed_stages"

          fi

          if [ "$JOB_STATUS" = "success" ]; then

            TEXT="$(
              printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n%s\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n⏱️ <b>TOTAL BUILD TIME</b>\n<code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n📊 <b>STAGES</b>\n%b\n━━━━━━━━━━━━━━━━━━━━\n\n🔢 MD5: <code>%s</code>\n\n📦 <a href="%s">GitHub Release</a>\n🔗 <a href="%s">Build Logs</a>' \
              "$STATUS" \
              "$DEVICE" \
              "${FOX_BRANCH:-unknown}" \
              "${TARGET:-unknown}" \
              "${OF_MAINTAINER:-unknown}" \
              "$(format_time "$TOTAL")" \
              "$STAGE_LIST" \
              "${MD5_IMG:-N/A}" \
              "$RELEASE_URL" \
              "$LOG_URL"
            )"

          else

            TEXT="$(
              printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n%s\n\n📱 Device: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n🔴 <b>FAILED STAGE</b>\n<code>%s</code>\n\n💥 <b>ERROR</b>\n<code>%s</code>\n\n⏱️ Total elapsed: <code>%s</code>\n\n━━━━━━━━━━━━━━━━━━━━\n\n📊 <b>COMPLETED STAGES</b>\n%b\n━━━━━━━━━━━━━━━━━━━━\n\n🔗 <a href="%s">Build Logs</a>' \
              "$STATUS" \
              "$DEVICE" \
              "${FOX_BRANCH:-unknown}" \
              "${TARGET:-unknown}" \
              "${CURRENT_STAGE:-unknown}" \
              "$FAILURE_REASON" \
              "$(format_time "$TOTAL")" \
              "$STAGE_LIST" \
              "$LOG_URL"
            )"

          fi

          MESSAGE_ID="$(
            cat "$STATE_DIR/telegram_message_id" \
              2>/dev/null \
              || true
          )"

          if [ -n "$MESSAGE_ID" ]; then

            RESPONSE="$(
              curl -sS -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/editMessageText" \
                -d "chat_id=${TG_CHAT_ID}" \
                -d "message_id=${MESSAGE_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=${TEXT}" \
                2>&1
            )"

            if echo "$RESPONSE" | grep -q '"ok":true'; then
              echo "Telegram final report updated."
            else
              echo "Telegram edit failed. Sending fallback message."

              curl -sS -X POST \
                "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                -d "chat_id=${TG_CHAT_ID}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "text=${TEXT}" \
                >/dev/null 2>&1 || true
            fi

          else

            curl -sS -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${TEXT}" \
              >/dev/null 2>&1 || true

          fi

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: ccache statistics
        if: always()
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "ccache directory:"
          echo "${CCACHE_DIR:-unknown}"
          echo "========================================"

          if [ -n "${CCACHE_DIR:-}" ]; then
            ccache -s || true
          fi

          echo "========================================"
          echo "Build state:"
          echo "========================================"

          if [ -f "$STATE_DIR/build_start" ]; then
            START="$(cat "$STATE_DIR/build_start")"
            NOW="$(date +%s)"
            echo "Total seconds: $((NOW - START))"
          fi

          if [ -f "$STATE_DIR/failure_reason" ]; then
            echo "========================================"
            echo "Failure reason:"
            cat "$STATE_DIR/failure_reason"
            echo "========================================"
          fi
