name: 🦊 OrangeFox Builder

on:
  workflow_dispatch:
    inputs:

      FOX_BRANCH:
        description: "OrangeFox Manifest Branch"
        required: true
        type: choice
        default: "12.1"
        options:
          - "16.0"
          - "14.1"
          - "12.1"
          - "11.0"
          - "10.0"
          - "9.0"
          - "8.1"
          - "7.1"
          - "6.0"

      DT_REPO_URL:
        description: "Custom Recovery Tree (public or private)"
        required: true
        type: string

      DT_BRANCH:
        description: "Custom Recovery Tree Branch"
        required: true
        default: "android-12.1"
        type: string

      BUILD_TARGET:
        description: "Build Target"
        required: true
        type: choice
        default: "vendorbootimage"
        options:
          - "vendorbootimage"
          - "recoveryimage"
          - "bootimage"

      USE_LATEST_MAGISK:
        description: "Bundle latest Magisk zip?"
        required: true
        type: boolean
        default: true

      UPLOAD_RESULTS:
        description: "Upload result to oshi.at / Gofile?"
        required: true
        type: boolean
        default: true

      LDCHECK:
        description: "Run LDCHECK"
        required: false
        type: boolean
        default: false

      LDCHECKPATH:
        description: "Blob path for LDCHECK"
        required: false
        default: "system/bin/qseecomd"
        type: string

      RUNNER_TYPE:
        description: "Runner"
        required: true
        type: choice
        default: "github"
        options:
          - "github"
          - "self-hosted"

      SELF_HOSTED_LABEL:
        description: "Self-hosted runner label"
        required: false
        default: "self-hosted"
        type: string

      CCACHE_SIZE:
        description: "ccache max size"
        required: true
        type: choice
        default: "50G"
        options:
          - "20G"
          - "50G"
          - "80G"
          - "100G"
          - "150G"
          - "200G"

      REPO_SYNC_JOBS:
        description: "repo sync jobs"
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
          - "4"


jobs:

  build:

    name: "🦊 fox_${{ inputs.FOX_BRANCH }}"

    runs-on: ${{ inputs.RUNNER_TYPE == 'self-hosted' && inputs.SELF_HOSTED_LABEL || 'ubuntu-22.04' }}

    timeout-minutes: 720

    permissions:
      contents: write

    env:

      GT_TOKEN: ${{ secrets.GT_TOKEN }}

      TG_TOKEN: ${{ secrets.TG_TOKEN }}

      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

      OF_MAINTAINER: ${{ github.actor }}

      TARGET: ${{ inputs.BUILD_TARGET }}

      REPO_SYNC_JOBS: ${{ inputs.REPO_SYNC_JOBS }}

      JACK_SERVER_VM_ARGUMENTS: "-Dfile.encoding=UTF-8"

      # Important for Android/OrangeFox build environments.
      LC_ALL: C

      LANG: C


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout builder repository
        uses: actions/checkout@v4


      # ============================================================
      # INITIALIZE STATE
      # ============================================================

      - name: Initialize build state
        shell: bash
        run: |

          set -euo pipefail

          STATE_DIR="${RUNNER_TEMP}/mkvenompro-build-state"

          mkdir -p "$STATE_DIR"

          echo "STATE_DIR=$STATE_DIR" >> "$GITHUB_ENV"

          date +%s > "$STATE_DIR/build_start"

          : > "$STATE_DIR/completed_stages"

          : > "$STATE_DIR/failure_reason"

          : > "$STATE_DIR/build.log"

          echo "Initializing" \
            > "$STATE_DIR/current_stage"

          date +%s \
            > "$STATE_DIR/current_stage_start"

          echo "FAILED_STAGE=" \
            >> "$GITHUB_ENV"

          echo "FAILURE_CLASS=" \
            >> "$GITHUB_ENV"

          echo "BUILD_FAILED_REASON=" \
            >> "$GITHUB_ENV"


      # ============================================================
      # DISPLAY INPUTS
      # ============================================================

      - name: Display inputs
        shell: bash
        run: |

          set -euo pipefail

          echo "========================================"

          echo "       MKVenomPro OrangeFox CI"

          echo "========================================"

          echo "OrangeFox       : ${{ inputs.FOX_BRANCH }}"

          echo "Target          : ${{ inputs.BUILD_TARGET }}"

          echo "Device tree     : ${{ inputs.DT_REPO_URL }}"

          echo "Tree branch     : ${{ inputs.DT_BRANCH }}"

          echo "Magisk          : ${{ inputs.USE_LATEST_MAGISK }}"

          echo "ccache size     : ${{ inputs.CCACHE_SIZE }}"

          echo "Upload          : ${{ inputs.UPLOAD_RESULTS }}"

          echo "LDCheck         : ${{ inputs.LDCHECK }}"

          echo "Runner          : ${{ inputs.RUNNER_TYPE }}"

          echo "Self-host label : ${{ inputs.SELF_HOSTED_LABEL }}"

          echo "Sync jobs       : ${{ inputs.REPO_SYNC_JOBS }}"

          echo "Maintainer      : ${{ github.actor }}"

          echo "========================================"


      # ============================================================
      # PARSE INPUTS
      # ============================================================

      - name: Parse inputs
        shell: bash
        run: |

          set -euo pipefail

          SYNC_BRANCH="${{ inputs.FOX_BRANCH }}"

          FOX_BRANCH="fox_${SYNC_BRANCH}"

          BRANCH_INT="${SYNC_BRANCH%%.*}"

          SYNC_PATH="${GITHUB_WORKSPACE}/OrangeFox/${FOX_BRANCH}"

          {
            echo "FOX_BRANCH=$FOX_BRANCH"
            echo "SYNC_BRANCH=$SYNC_BRANCH"
            echo "BRANCH_INT=$BRANCH_INT"
            echo "SYNC_PATH=$SYNC_PATH"
          } >> "$GITHUB_ENV"


      # ============================================================
      # VALIDATE RUNNER
      # ============================================================

      - name: Validate runner
        shell: bash
        run: |

          set -euo pipefail

          echo "========================================"
          echo "Runner information"
          echo "========================================"

          echo "Hostname:"
          hostname || true

          echo

          echo "Architecture:"
          uname -m || true

          echo

          echo "Kernel:"
          uname -r || true

          echo

          echo "CPU:"
          nproc || true

          echo

          echo "Memory:"
          free -h || true

          echo

          echo "Disk:"
          df -h || true

          echo

          echo "Runner:"
          echo "${{ inputs.RUNNER_TYPE }}"

          echo

          echo "Sync jobs:"
          echo "$REPO_SYNC_JOBS"

          echo "========================================"

          if ! [[ "$REPO_SYNC_JOBS" =~ ^[1-4]$ ]]; then

            echo "::error::REPO_SYNC_JOBS must be 1-4."

            exit 1

          fi


      # ============================================================
      # CLEAN GITHUB RUNNER ONLY
      # ============================================================

      - name: Clean up GitHub runner
        if: inputs.RUNNER_TYPE != 'self-hosted'
        uses: rokibhasansagar/slimhub_actions@main


      - name: Add swap space
        if: inputs.RUNNER_TYPE != 'self-hosted'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12


      # ============================================================
      # SELF HOSTED PREPARATION
      # ============================================================

      - name: Prepare self-hosted runner
        if: inputs.RUNNER_TYPE == 'self-hosted'
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Prepare self-hosted runner"


          echo "Self-hosted runner detected."

          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"


          # Remove stale build leftovers.
          rm -rf \
            "$GITHUB_WORKSPACE/OrangeFox" \
            "$GITHUB_WORKSPACE/.ccache" \
            2>/dev/null || true


          # Remove stale Android environment variables
          # which can break envsetup.sh on persistent runners.

          unset TOP \
            ANDROID_BUILD_TOP \
            ANDROID_HOST_OUT \
            ANDROID_PRODUCT_OUT \
            OUT_DIR \
            OUT_DIR_COMMON_BASE \
            TARGET_PRODUCT \
            TARGET_BUILD_VARIANT \
            TARGET_DEVICE \
            BUILD_NUMBER \
            BUILD_ID \
            2>/dev/null || true


          "$STATE_DIR/stage_end.sh" \
            "Prepare self-hosted runner" \
            success


      # ============================================================
      # STAGE HELPERS
      # ============================================================

      - name: Install stage helper
        shell: bash
        run: |

          set -euo pipefail

          cat > "$STATE_DIR/stage_start.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"

          NOW="$(date +%s)"

          echo "$STAGE" > "$STATE_DIR/current_stage"

          echo "$NOW" > "$STATE_DIR/current_stage_start"

          echo

          echo "========================================"

          echo "🔵 STAGE: $STAGE"

          echo "🕐 Started: $(date '+%Y-%m-%d %H:%M:%S')"

          echo "========================================"
          EOF


          cat > "$STATE_DIR/stage_end.sh" <<'EOF'
          #!/usr/bin/env bash

          STAGE="$1"

          STATUS="${2:-success}"

          NOW="$(date +%s)"

          START="$(
            cat "$STATE_DIR/current_stage_start" \
            2>/dev/null ||
            echo "$NOW"
          )"

          ELAPSED=$((NOW - START))

          echo "$STAGE|$STATUS|$ELAPSED" \
            >> "$STATE_DIR/completed_stages"

          if [ "$STATUS" = "success" ]; then

            echo "🟢 STAGE COMPLETE: $STAGE"

          else

            echo "🔴 STAGE FAILED: $STAGE"

          fi

          echo "⏱️ Duration: ${ELAPSED}s"
          EOF


          chmod +x \
            "$STATE_DIR/stage_start.sh" \
            "$STATE_DIR/stage_end.sh"


      # ============================================================
      # TELEGRAM ESCAPE
      # ============================================================

      - name: Install Telegram helpers
        shell: bash
        run: |

          set -euo pipefail

          cat > "$STATE_DIR/tg_escape.sh" <<'EOF'
          #!/usr/bin/env bash

          printf '%s' "${1:-}" |
            sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g'
          EOF

          chmod +x "$STATE_DIR/tg_escape.sh"


      # ============================================================
      # TELEGRAM START
      # ============================================================

      - name: Telegram — build started
        if: always()
        continue-on-error: true
        shell: bash
        run: |

          set +e

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then

            echo "Telegram disabled."

            exit 0

          fi


          escape_html() {

            "$STATE_DIR/tg_escape.sh" "$1"

          }


          TEXT="$(
            printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n🚀 <b>BUILD STARTED</b>\n\n📢 <b>@mkvenompro</b>\n\n🌿 OrangeFox: <code>%s</code>\n🎯 Target: <code>%s</code>\n🌲 Tree: <code>%s</code>\n🌿 Tree branch: <code>%s</code>\n🖥 Runner: <code>%s</code>\n⚙️ Sync jobs: <code>%s</code>\n👤 Maintainer: <code>%s</code>\n\n🔵 <b>Current stage:</b> Initializing\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
              "$(escape_html "$FOX_BRANCH")" \
              "$(escape_html "$TARGET")" \
              "$(escape_html "${{ inputs.DT_REPO_URL }}")" \
              "$(escape_html "${{ inputs.DT_BRANCH }}")" \
              "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
              "$(escape_html "$REPO_SYNC_JOBS")" \
              "$(escape_html "$OF_MAINTAINER")" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
          )"


          RESPONSE="$(
            curl -sS \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST \
              "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d "chat_id=${TG_CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${TEXT}" \
              2>&1
          )"


          MESSAGE_ID="$(
            echo "$RESPONSE" |
              jq -r '.result.message_id // empty' \
              2>/dev/null
          )"


          if [ -n "$MESSAGE_ID" ]; then

            echo "$MESSAGE_ID" \
              > "$STATE_DIR/telegram_message_id"

            echo "Telegram start notification sent."

          else

            echo "::warning::Telegram start notification failed."

            echo "$RESPONSE"

          fi


      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Install build environment
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Prepare environment"


          sudo apt-get update -qq \
            2>&1 |
            tee -a "$STATE_DIR/build.log"


          sudo apt-get install -y \
            aria2 \
            jq \
            curl \
            wget \
            git \
            ccache \
            patchelf \
            cpio \
            lz4 \
            unzip \
            rsync \
            bc \
            bison \
            flex \
            gperf \
            build-essential \
            zip \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            libxml2-utils \
            xsltproc \
            2>&1 |
            tee -a "$STATE_DIR/build.log"


          if [ -d "$HOME/ofox-scripts/.git" ]; then

            cd "$HOME/ofox-scripts"

            git fetch \
              --depth=1 \
              origin \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

            git reset \
              --hard \
              origin/HEAD \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

          else

            rm -rf "$HOME/ofox-scripts"

            git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/misc/scripts \
              "$HOME/ofox-scripts" \
              2>&1 |
              tee -a "$STATE_DIR/build.log"

          fi


          cd "$HOME/ofox-scripts"


          sudo bash setup/android_build_env.sh \
            2>&1 |
            tee -a "$STATE_DIR/build.log"


          "$STATE_DIR/stage_end.sh" \
            "Prepare environment" \
            success


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Configure ccache"


          CANDIDATES=(

            "${RUNNER_TEMP}/mkvenompro-ccache"

            "${GITHUB_WORKSPACE}/.ccache"

            "${HOME}/.cache/ccache"

            "${HOME}/.ccache"

          )


          CCACHE_SELECTED=""


          for DIR in "${CANDIDATES[@]}"; do

            mkdir -p "$DIR" \
              2>/dev/null ||
              continue

            TEST="$DIR/.write-test"

            if touch "$TEST" \
              2>/dev/null; then

              rm -f "$TEST"

              CCACHE_SELECTED="$DIR"

              break

            fi

          done


          if [ -z "$CCACHE_SELECTED" ]; then

            echo "::error::No writable ccache directory found."

            exit 1

          fi


          {
            echo "CCACHE_DIR=$CCACHE_SELECTED"

            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"

            echo "CCACHE_NOHASHDIR=true"

          } >> "$GITHUB_ENV"


          mkdir -p "$CCACHE_SELECTED"

          ccache -M "${{ inputs.CCACHE_SIZE }}"

          ccache -z

          ccache -s


          "$STATE_DIR/stage_end.sh" \
            "Configure ccache" \
            success


      # ============================================================
      # CCACHE CACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:

          path: ${{ env.CCACHE_DIR }}

          key: ccache-${{ runner.os }}-${{ inputs.FOX_BRANCH }}-${{ hashFiles('**/BoardConfig.mk') }}

          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.FOX_BRANCH }}-
            ccache-${{ runner.os }}-


      # ============================================================
      # GIT AUTH
      # ============================================================

      - name: Configure git authentication
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Configure git"


          git config --global \
            user.name \
            "${{ github.actor }}"


          git config --global \
            user.email \
            "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"


          git config --global \
            color.ui false


          git config --global \
            http.postBuffer \
            524288000


          if [ -n "${GT_TOKEN:-}" ]; then

            git config --global \
              url."https://x-access-token:${GT_TOKEN}@github.com/".insteadOf \
              "https://github.com/"

          fi


          "$STATE_DIR/stage_end.sh" \
            "Configure git" \
            success


      # ============================================================
      # CLONE ORANGEFOX SYNC
      # ============================================================

      - name: Clone OrangeFox sync
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Clone OrangeFox sync"


          mkdir -p \
            "${GITHUB_WORKSPACE}/OrangeFox"


          cd \
            "${GITHUB_WORKSPACE}/OrangeFox"


          if [ -d "sync/.git" ]; then

            cd sync

            git fetch \
              --depth=1 \
              origin

            git reset \
              --hard \
              origin/HEAD

          else

            rm -rf sync

            git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/sync.git \
              sync

          fi


          "$STATE_DIR/stage_end.sh" \
            "Clone OrangeFox sync" \
            success


      # ============================================================
      # SYNC ORANGEFOX
      # ============================================================

      - name: Sync OrangeFox sources
        shell: bash
        run: |

          set +e

          "$STATE_DIR/stage_start.sh" \
            "Sync OrangeFox sources"


          cd \
            "${GITHUB_WORKSPACE}/OrangeFox/sync"


          chmod +x \
            ./orangefox_sync.sh


          echo "Running OrangeFox sync..."

          echo "Branch: $SYNC_BRANCH"

          echo "Path: $SYNC_PATH"

          echo "Jobs: $REPO_SYNC_JOBS"


          ./orangefox_sync.sh \
            --branch "$SYNC_BRANCH" \
            --path "$SYNC_PATH"

          SYNC_STATUS=$?


          if [ "$SYNC_STATUS" -ne 0 ]; then

            echo

            echo "OrangeFox sync failed."

            echo "Retrying with repo sync -j1..."

            cd "$SYNC_PATH"

            repo sync \
              -j1 \
              --force-sync \
              -c \
              --no-clone-bundle \
              --no-tags

            SYNC_STATUS=$?

          fi


          if [ "$SYNC_STATUS" -ne 0 ]; then

            echo "SYNC FAILED" \
              > "$STATE_DIR/failure_reason"

            "$STATE_DIR/stage_end.sh" \
              "Sync OrangeFox sources" \
              failure

            exit 1

          fi


          "$STATE_DIR/stage_end.sh" \
            "Sync OrangeFox sources" \
            success


      # ============================================================
      # CLONE DEVICE TREE
      # ============================================================

      - name: Clone device tree
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Clone Device Tree"


          cd "$SYNC_PATH"


          DT_URL="${{ inputs.DT_REPO_URL }}"

          DT_BRANCH="${{ inputs.DT_BRANCH }}"


          rm -rf device_tree_staging


          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DT_BRANCH" \
            "$DT_URL" \
            device_tree_staging


          STAGING_PATH="$SYNC_PATH/device_tree_staging"


          cd "$STAGING_PATH"


          DEVICE_MAKEFILE=""

          DEVICE_DIRECTORY=""

          DEVICE_NAME=""


          while IFS= read -r -d '' file; do

            P_NAME="$(
              grep -m1 \
                '^[[:space:]]*PRODUCT_NAME' \
                "$file" |
              awk -F'=' '{print $2}' |
              tr -d ' ' ||
              true
            )"


            P_BRAND="$(
              grep -m1 \
                '^[[:space:]]*PRODUCT_BRAND' \
                "$file" |
              awk -F'=' '{print $2}' |
              tr -d ' ' ||
              true
            )"


            P_DEVICE="$(
              grep -m1 \
                '^[[:space:]]*PRODUCT_DEVICE' \
                "$file" |
              awk -F'=' '{print $2}' |
              tr -d ' ' ||
              true
            )"


            if [ -n "$P_NAME" ] && \
               [ -n "$P_BRAND" ] && \
               [ -n "$P_DEVICE" ]; then

              DEVICE_MAKEFILE="$(basename "$file")"

              DEVICE_DIRECTORY="device/$P_BRAND"

              DEVICE_NAME="$P_DEVICE"

              break

            fi

          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.mk" \
              -print0
          )


          if [ -z "$DEVICE_NAME" ]; then

            echo "::error::Could not detect device codename."

            exit 1

          fi


          mkdir -p \
            "$SYNC_PATH/$DEVICE_DIRECTORY"


          rm -rf \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"


          mv \
            "$STAGING_PATH" \
            "$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"


          TREE_PATH="$SYNC_PATH/$DEVICE_DIRECTORY/$DEVICE_NAME"


          COMMIT_ID="$(
            git -C "$TREE_PATH" \
              rev-parse HEAD
          )"


          {
            echo "DEVICE_NAME=$DEVICE_NAME"

            echo "DEVICE_DIRECTORY=$DEVICE_DIRECTORY"

            echo "DEVICE_MAKEFILE=$DEVICE_MAKEFILE"

            echo "DEVICE_TREE_PATH=$TREE_PATH"

            echo "COMMIT_ID=$COMMIT_ID"

          } >> "$GITHUB_ENV"


          echo "Detected device: $DEVICE_NAME"

          echo "Device path: $TREE_PATH"

          echo "Commit: $COMMIT_ID"


          "$STATE_DIR/stage_end.sh" \
            "Clone Device Tree" \
            success


      # ============================================================
      # MAGISK
      # ============================================================

      - name: Download latest Magisk
        if: inputs.USE_LATEST_MAGISK == true
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Download Magisk"


          mkdir -p "$HOME/Magisk"

          cd "$HOME/Magisk"


          RESPONSE="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest
          )"


          URL="$(
            echo "$RESPONSE" |
            jq -r \
              '[.assets[] |
               select(.name | test("^Magisk-.*\\.apk$")) |
               .browser_download_url][0]'
          )"


          if [ -z "$URL" ] || \
             [ "$URL" = "null" ]; then

            echo "::error::Could not find latest Magisk APK."

            exit 1

          fi


          curl -fL \
            "$URL" \
            -o magisk.apk


          mv \
            magisk.apk \
            Magisk-latest.zip


          echo "FOX_USE_SPECIFIC_MAGISK_ZIP=$HOME/Magisk/Magisk-latest.zip" \
            >> "$GITHUB_ENV"


          "$STATE_DIR/stage_end.sh" \
            "Download Magisk" \
            success


      # ============================================================
      # BUILD ORANGEFOX
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Build OrangeFox"


          BUILD_LOG="$STATE_DIR/build.log"


          cd "$SYNC_PATH"


          echo "========================================"

          echo "OrangeFox build started"

          echo "========================================"

          echo "Device: $DEVICE_NAME"

          echo "Target: $TARGET"

          echo "TOP: $SYNC_PATH"

          echo "========================================"


          # --------------------------------------------------------
          # CRITICAL FIX
          #
          # OrangeFox envsetup expects TOP to exist in some
          # branches/configurations.
          #
          # On persistent self-hosted runners, stale Android
          # variables can also interfere with envsetup.
          # --------------------------------------------------------

          unset \
            ANDROID_BUILD_TOP \
            ANDROID_HOST_OUT \
            ANDROID_PRODUCT_OUT \
            OUT_DIR \
            OUT_DIR_COMMON_BASE \
            TARGET_PRODUCT \
            TARGET_BUILD_VARIANT \
            TARGET_DEVICE \
            BUILD_NUMBER \
            BUILD_ID \
            2>/dev/null || true


          export TOP="$SYNC_PATH"

          export ANDROID_BUILD_TOP="$SYNC_PATH"

          export PWD="$SYNC_PATH"


          # OrangeFox/AOSP compatibility.

          export ZSH_VERSION=""

          export ENVSETUP_NO_COMPLETION=1


          # --------------------------------------------------------
          # Source envsetup WITHOUT nounset.
          #
          # This is the important part.
          # envsetup scripts from different Android/OrangeFox
          # branches are not safe under bash -u.
          # --------------------------------------------------------

          set +u

          source "$SYNC_PATH/build/envsetup.sh"

          ENVSETUP_STATUS=$?

          set -u


          if [ "$ENVSETUP_STATUS" -ne 0 ]; then

            echo "::error::build/envsetup.sh failed."

            {
              echo "BUILD / ENVSETUP"

              echo "OrangeFox envsetup failed."

              echo

              tail -200 "$BUILD_LOG"

            } > "$STATE_DIR/failure_reason"


            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"


            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure


            exit "$ENVSETUP_STATUS"

          fi


          # --------------------------------------------------------
          # Verify Android build environment.
          # --------------------------------------------------------

          export TOP="$SYNC_PATH"

          export ANDROID_BUILD_TOP="$SYNC_PATH"


          echo

          echo "Environment after envsetup:"

          echo "TOP=$TOP"

          echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"

          echo "PWD=$(pwd)"

          echo


          if [ ! -d "$TOP/build" ]; then

            echo "::error::TOP is incorrect: $TOP"

            exit 1

          fi


          if [ ! -f "$TOP/build/envsetup.sh" ]; then

            echo "::error::envsetup.sh not found."

            exit 1

          fi


          # --------------------------------------------------------
          # OrangeFox variables
          # --------------------------------------------------------

          export FOX_BUILD_DEVICE="$DEVICE_NAME"

          export OF_MAINTAINER="$OF_MAINTAINER"

          export ALLOW_MISSING_DEPENDENCIES=true

          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1

          export FOX_BUILD_TYPE="Unofficial-CI"

          export LC_ALL=C

          export LANG=C

          export USE_CCACHE=1

          export CCACHE_EXEC="$(command -v ccache)"

          export FOX_MAINTAINER_PATCH_VERSION=1

          export FOX_AB_DEVICE=1

          export FOX_VIRTUAL_AB_DEVICE=1


          if [ -n "${FOX_USE_SPECIFIC_MAGISK_ZIP:-}" ]; then

            export FOX_USE_SPECIFIC_MAGISK_ZIP

          fi


          # --------------------------------------------------------
          # Determine lunch target
          # --------------------------------------------------------

          LUNCH_OVERRIDE="$DEVICE_TREE_PATH/lunch_target.txt"


          if [ -f "$LUNCH_OVERRIDE" ]; then

            LUNCH_TARGET="$(
              tr -d '[:space:]' \
              < "$LUNCH_OVERRIDE"
            )"

          else

            LUNCH_TARGET="twrp_${DEVICE_NAME}-eng"

          fi


          if [ -z "$LUNCH_TARGET" ]; then

            echo "::error::LUNCH_TARGET is empty."

            exit 1

          fi


          echo "Lunch target: $LUNCH_TARGET"


          # --------------------------------------------------------
          # Lunch
          # --------------------------------------------------------

          if ! lunch "$LUNCH_TARGET" \
            2>&1 |
            tee -a "$BUILD_LOG"; then

            echo "::error::lunch failed."

            {
              echo "BUILD / LUNCH"

              echo "Lunch target: $LUNCH_TARGET"

              echo

              tail -200 "$BUILD_LOG"

            } > "$STATE_DIR/failure_reason"


            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"


            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure


            exit 1

          fi


          # --------------------------------------------------------
          # Clean
          # --------------------------------------------------------

          echo

          echo "Running make clean..."


          if ! make clean \
            2>&1 |
            tee -a "$BUILD_LOG"; then

            echo "::error::make clean failed."

            {
              echo "BUILD / CLEAN"

              echo "make clean failed."

              echo

              tail -200 "$BUILD_LOG"

            } > "$STATE_DIR/failure_reason"


            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"


            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure


            exit 1

          fi


          # --------------------------------------------------------
          # BUILD
          # --------------------------------------------------------

          echo

          echo "Running OrangeFox build..."

          echo "Target: $TARGET"

          echo


          if ! mka adbd "$TARGET" \
            2>&1 |
            tee -a "$BUILD_LOG"; then

            echo "::error::OrangeFox compilation failed."

            {
              echo "BUILD / COMPILATION"

              echo "OrangeFox compilation failed."

              echo

              tail -250 "$BUILD_LOG"

            } > "$STATE_DIR/failure_reason"


            echo "FAILED_STAGE=Build OrangeFox" \
              >> "$GITHUB_ENV"


            "$STATE_DIR/stage_end.sh" \
              "Build OrangeFox" \
              failure


            exit 1

          fi


          "$STATE_DIR/stage_end.sh" \
            "Build OrangeFox" \
            success


      # ============================================================
      # VALIDATE OUTPUT
      # ============================================================

      - name: Validate build output
        shell: bash
        run: |

          set -euo pipefail

          "$STATE_DIR/stage_start.sh" \
            "Validate Output"


          OUT="$SYNC_PATH/out/target/product/$DEVICE_NAME"


          case "$TARGET" in

            vendorbootimage)

              IMAGE="$OUT/vendor_boot.img"

              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-vendor_boot.img"

              ;;

            recoveryimage)

              IMAGE="$OUT/recovery.img"

              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-recovery.img"

              ;;

            bootimage)

              IMAGE="$OUT/boot.img"

              RELEASE_IMAGE="OrangeFox-${DEVICE_NAME}-boot.img"

              ;;

            *)

              echo "::error::Unknown target: $TARGET"

              exit 1

              ;;

          esac


          if [ ! -f "$IMAGE" ]; then

            echo "::error::Expected image was not produced: $IMAGE"

            echo

            find "$OUT" \
              -maxdepth 2 \
              -type f \
              2>/dev/null |
              head -100

            exit 1

          fi


          cp -f \
            "$IMAGE" \
            "$OUT/$RELEASE_IMAGE"


          ZIP="$(
            find "$OUT" \
              -maxdepth 1 \
              -type f \
              -iname 'OrangeFox*.zip' \
              -print \
              -quit ||
            true
          )"


          echo "OUT_DIR=$OUT" \
            >> "$GITHUB_ENV"

          echo "IMAGE_PATH=$IMAGE" \
            >> "$GITHUB_ENV"

          echo "RELEASE_IMAGE=$RELEASE_IMAGE" \
            >> "$GITHUB_ENV"

          echo "FOX_ZIP=$ZIP" \
            >> "$GITHUB_ENV"

          echo "CHECK_IMG_IS_OK=true" \
            >> "$GITHUB_ENV"

          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M)" \
            >> "$GITHUB_ENV"


          echo

          echo "========================================"

          echo "BUILD SUCCESS"

          echo "========================================"

          echo "Image: $IMAGE"

          echo "Size: $(du -h "$IMAGE" | cut -f1)"

          echo "========================================"


          "$STATE_DIR/stage_end.sh" \
            "Validate Output" \
            success


      # ============================================================
      # UPLOAD GITHUB RELEASE
      # ============================================================

      - name: Upload to GitHub Release
        if: inputs.UPLOAD_RESULTS == true && env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v2
        with:

          files: |
            ${{ env.IMAGE_PATH }}
            ${{ env.OUT_DIR }}/${{ env.RELEASE_IMAGE }}
            ${{ env.FOX_ZIP }}

          name: "🦊 OrangeFox ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"

          tag_name: "build-${{ github.run_id }}"

          token: ${{ secrets.GITHUB_TOKEN }}


      # ============================================================
      # TELEGRAM SUCCESS
      # ============================================================

      - name: Telegram — build success
        if: success()
        continue-on-error: true
        shell: bash
        run: |

          set +e

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then

            exit 0

          fi


          TEXT="$(
            printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n✅ <b>BUILD SUCCESS</b>\n\n📱 Device: <code>%s</code>\n🎯 Target: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🖥 Runner: <code>%s</code>\n\n📦 <b>Output:</b>\n<code>%s</code>\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
              "${DEVICE_NAME:-unknown}" \
              "$TARGET" \
              "$FOX_BRANCH" \
              "${{ inputs.RUNNER_TYPE }}" \
              "${RELEASE_IMAGE:-unknown}" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
          )"


          curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            >/dev/null 2>&1 || true


      # ============================================================
      # FAILURE REPORT
      # ============================================================

      - name: Collect failure information
        if: failure()
        shell: bash
        run: |

          set +e

          LOG="$STATE_DIR/build.log"


          echo

          echo "========================================"

          echo "FAILURE INFORMATION"

          echo "========================================"


          echo "Current stage:"

          cat "$STATE_DIR/current_stage" \
            2>/dev/null ||
            true


          echo

          echo "Failure reason:"

          if [ -s "$STATE_DIR/failure_reason" ]; then

            cat "$STATE_DIR/failure_reason"

          else

            echo "No structured failure reason available."

            echo

            tail -250 "$LOG" \
              2>/dev/null ||
              true

          fi


          echo

          echo "========================================"


      # ============================================================
      # TELEGRAM FAILURE
      # ============================================================

      - name: Telegram — build failed
        if: failure()
        continue-on-error: true
        shell: bash
        run: |

          set +e

          if [ -z "${TG_TOKEN:-}" ] || \
             [ -z "${TG_CHAT_ID:-}" ]; then

            exit 0

          fi


          STAGE="$(
            cat "$STATE_DIR/current_stage" \
            2>/dev/null ||
            echo "Unknown"
          )"


          REASON="$(
            cat "$STATE_DIR/failure_reason" \
            2>/dev/null |
            tail -12
          )"


          escape_html() {

            "$STATE_DIR/tg_escape.sh" "$1"

          }


          TEXT="$(
            printf \
              '🦊 <b>MKVenomPro OrangeFox Builder</b>\n\n❌ <b>BUILD FAILED</b>\n\n📱 Device: <code>%s</code>\n🎯 Target: <code>%s</code>\n🌿 OrangeFox: <code>%s</code>\n🖥 Runner: <code>%s</code>\n\n🔴 <b>Stage:</b> <code>%s</code>\n\n<b>Reason:</b>\n<pre>%s</pre>\n\n🔗 <a href="https://github.com/%s/actions/runs/%s">Build logs</a>' \
              "$(escape_html "${DEVICE_NAME:-unknown}")" \
              "$(escape_html "$TARGET")" \
              "$(escape_html "$FOX_BRANCH")" \
              "$(escape_html "${{ inputs.RUNNER_TYPE }}")" \
              "$(escape_html "$STAGE")" \
              "$(escape_html "$REASON")" \
              "$GITHUB_REPOSITORY" \
              "$GITHUB_RUN_ID"
          )"


          curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}" \
            >/dev/null 2>&1 || true


      # ============================================================
      # STOP TELEGRAM MONITOR
      # ============================================================

      - name: Stop Telegram monitor
        if: always()
        continue-on-error: true
        shell: bash
        run: |

          set +e

          touch "$STATE_DIR/stop_monitor"

          if [ -f "$STATE_DIR/telegram_monitor_pid" ]; then

            PID="$(cat "$STATE_DIR/telegram_monitor_pid")"

            kill "$PID" \
              2>/dev/null ||
              true

          fi


      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |

          set +e

          ccache -s \
            2>/dev/null ||
            true


      # ============================================================
      # UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: orangefox-build-log-${{ github.run_id }}

          path: |
            ${{ env.STATE_DIR }}/build.log
            ${{ env.STATE_DIR }}/failure_reason
            ${{ env.STATE_DIR }}/completed_stages

          if-no-files-found: ignore
